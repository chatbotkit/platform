# Garage (S3-compatible object storage) - single-node LOCAL configuration,
# used by the docker compose stack. The storage module speaks the S3 protocol,
# so any S3-compatible store works; Garage is the reference store the compose
# file stands up.
#
# WARNING: the rpc_secret and admin token below are known development values
# for the local stack only. A real deployment generates its own
# (`openssl rand -hex 32`) - and almost certainly runs a real store with
# replication rather than this single-node layout.
#
# @note the distribution stack carries an inline copy of this file (a
# published Compose OCI artifact cannot bind-mount it) - keep
# docker/distro/community/compose.yml's garage-config in sync.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec"

[s3_api]
# @note the region is part of every SigV4 signature: STORAGE_REGION must
# match it, or every request fails authentication
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
# @note the garage-init compose service provisions the layout, the access key
# and the buckets through this API
api_bind_addr = "[::]:3903"
admin_token = "dev-admin-token"
