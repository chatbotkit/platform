# =============================================================================
# ChatBotKit Platform - studio distribution stack
# =============================================================================
# The self-contained, image-only Compose application published to
# ghcr.io/chatbotkit/platform-studio as an OCI artifact. Consumers run the
# whole platform - application, database initialization, Redis, Qdrant and
# Garage object storage - with a single command and no checkout:
#
#   docker compose -f oci://ghcr.io/chatbotkit/platform-studio:latest up
#
# The same file runs directly from the repository:
#
#   docker compose -f docker/distro/studio/compose.yml up -d
#
# Everything a service needs travels inside this file or inside a published
# image: configuration is inlined through the top-level `configs` element and
# the Garage provisioning script ships inside the initializer image, so there
# are no bind mounts - the one restriction `docker compose publish` enforces.
# The developer stack with profiles, source builds and hot reload lives in
# docker-compose.yml at the repository root; this file never builds anything.
#
# Where the stack answers is not fixed: PLATFORM_PORT moves the application
# (and with it the app shells, spaces and portals), RELAY_PORT the realtime
# relay and STORAGE_PORT the object store, and every address a browser or a
# host process dials is declared once in the `x-cbk` manifest below. A
# launcher such as ChatBotKit Studio reads the resolved manifest back with
# `docker compose config --format json` rather than assuming a port.
#
# Studio publishes on 31000, 31001 and 31900 rather than Community's 3000
# family: it runs beside whatever a developer already has on 3000, and the
# published ports are the only difference - every container keeps its port.
#
# One folder per package flavor lives under docker/distro/. Each publishes as
# ghcr.io/chatbotkit/platform-<flavor>, pinned by CI to the matching
# application and initializer image digests of the same flavor.
# =============================================================================

# @note the endpoint manifest. Each entry is one address that something
# outside the Compose network dials - a browser, a desktop launcher, the
# application itself when it fetches a presigned URL - with the service that
# answers, the host port it is published on and the variable that overrides
# it. The `url` values are the same expressions the services receive (the
# anchors below feed `environment`), so `docker compose config --format json`
# resolves them against the caller's environment and `.["x-cbk"]` is the exact
# addressing this stack runs with; no port is assumed on either side. Plain
# Compose ignores `x-` keys. Bump `version` when an entry changes shape.
#
# Hostnames stay under `*.localhost`, which browsers resolve to loopback with
# no DNS setup. A launcher that forwards the published ports must route every
# host named here, including the wildcard apexes, to the same ports.
x-cbk:
  version: 1
  endpoints:
    site:
      service: platform
      published: ${PLATFORM_PORT:-31000}
      variable: SITE_URL
      url: &site-url ${SITE_URL:-http://${PLATFORM_HOST:-cbk.localhost}:${PLATFORM_PORT:-31000}}
    apps:
      service: platform
      published: ${PLATFORM_PORT:-31000}
      variable: APP_MAIN_ORIGIN
      url: &apps-url ${APP_MAIN_ORIGIN:-http://cbk-apps.localhost:${PLATFORM_PORT:-31000}}
    labs:
      service: platform
      published: ${PLATFORM_PORT:-31000}
      variable: APP_LABS_ORIGIN
      url: &labs-url ${APP_LABS_ORIGIN:-http://cbk-labs.localhost:${PLATFORM_PORT:-31000}}
    relay:
      service: platform
      published: ${RELAY_PORT:-31001}
      variable: RELAY_URL
      url: &relay-url ${RELAY_URL:-http://cbk-relay.localhost:${RELAY_PORT:-31001}}
    storage:
      service: garage
      published: ${STORAGE_PORT:-31900}
      variable: STORAGE_URL
      url: &storage-url ${STORAGE_URL:-http://cbk-storage.localhost:${STORAGE_PORT:-31900}}
  # @note wildcard host families served on the site endpoint's port: a space
  # published as `acme` answers at `http://acme.<space apex>:<published>`
  apexes:
    space:
      service: platform
      published: ${PLATFORM_PORT:-31000}
      variable: SPACE_APEX
      apex: &space-apex ${SPACE_APEX:-cbk-space.localhost}
    portal:
      service: platform
      published: ${PLATFORM_PORT:-31000}
      variable: PORTAL_APEX
      apex: &portal-apex ${PORTAL_APEX:-cbk-portal.localhost}

# @note the storage environment every application service shares. The store
# is Garage, spoken to over the plain S3 protocol. Left empty, the access key
# is generated by Garage on first boot and persisted in the platform-data
# volume (garage-init provisions it, the application entrypoint sources it);
# set STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY to use a fixed pair.
#
# @note the store is a separate, published service with one name everywhere,
# like the relay and the app shells: browsers resolve `cbk-storage.localhost`
# to loopback with no DNS setup, and inside the network the garage service
# carries it as an alias on the same port (STORAGE_PORT). Presigned URLs embed
# this endpoint and are fetched by both browsers and the application itself,
# so the two must agree. Set STORAGE_URL to an address both can reach (and
# TLS if the site has it) when browsers do not reach the machine itself.
x-storage-env: &storage-env
  STORAGE_ENDPOINT: *storage-url
  STORAGE_REGION: garage
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  STORAGE_FORCE_PATH_STYLE: 'true'
  FILE_S3_BUCKET_NAME: file
  IMAGE_S3_BUCKET_NAME: image
  VIDEO_S3_BUCKET_NAME: video
  AUDIO_S3_BUCKET_NAME: audio
  CONVERSATION_S3_BUCKET_NAME: conversation
  NAMESPACE_S3_BUCKET_NAME: namespace
  SESSION_S3_BUCKET_NAME: session
  SPACE_S3_BUCKET_NAME: space
  TEMP_S3_BUCKET_NAME: temp
  OUTPUT_S3_BUCKET_NAME: output

services:
  platform:
    image: ${PLATFORM_IMAGE:-ghcr.io/chatbotkit/platform-studio-app:next}
    ports:
      # @note studio trusts the local user, so its ports stay on loopback;
      # PLATFORM_PORT moves the published side, the container keeps 3000.
      # Same for the relay (RELAY_PORT, container 3001) below
      - '127.0.0.1:${PLATFORM_PORT:-31000}:3000'
      # @note the built-in realtime relay - see RELAY_URL below
      - '127.0.0.1:${RELAY_PORT:-31001}:3001'
    environment:
      <<: *storage-env
      NODE_ENV: production
      PORT: 3000
      SITE_URL: *site-url
      STATIC_URL: ${STATIC_URL:-}
      API_URL: ${API_URL:-}
      HOSTS_CONFIG: ${HOSTS_CONFIG:-}
      # @note sign-in callbacks land on the site itself unless moved
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${SITE_URL:-http://${PLATFORM_HOST:-cbk.localhost}:${PLATFORM_PORT:-31000}}}
      # @note an explicitly empty value restores ordinary email sign-in
      NEXTAUTH_TRUSTED_SIGNIN: ${NEXTAUTH_TRUSTED_SIGNIN-true}
      # @note realtime channels (voice, avatars) meet at a relay the platform
      # process hosts itself on RELAY_PORT. Both that process and a host
      # browser dial RELAY_URL, so loopback serves both; a browser elsewhere
      # needs an address it can reach instead (and TLS if the site has it)
      RELAY_PORT: 3001
      RELAY_URL: *relay-url
      # @note host routing reads its settings at server startup; recreate the
      # container to change domains without rebuilding the image. See x-cbk
      SPACE_APEX: *space-apex
      PORTAL_APEX: *portal-apex
      APP_APEX: ${APP_APEX:-}
      PARTNERS_APEX: ${PARTNERS_APEX:-}
      # @note cookies do not cross hosts, so sign in on the shell host itself
      APP_MAIN_ORIGIN: *apps-url
      APP_LABS_ORIGIN: *labs-url
      # @note left empty, the image generates these secrets on first boot and
      # persists them in the platform-data volume; set explicitly to override
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      QUEUE_SECRET: ${QUEUE_SECRET:-}
      JWT_TOKEN_SECRET_KEY: ${JWT_TOKEN_SECRET_KEY:-}
      CLOAK_ENCRYPTION_KEY: ${CLOAK_ENCRYPTION_KEY:-}
      PRISMA_DATABASE_URL: file:/data/chatbotkit.db
      # @note sandbox workspaces - what agents write and install - live in the
      # data volume so they survive restarts
      SANDBOX_DATA_DIR: /data/sandbox
      # @note optional: encrypts stored credentials in the database; unset,
      # they are stored as given. See docs/configuration.md, "Encryption at rest"
      PRISMA_FIELD_ENCRYPTION_KEY: ${PRISMA_FIELD_ENCRYPTION_KEY:-}
      # @note optional platform-wide provider keys; users can also supply
      # their own keys through the application itself. Any variable the
      # application honours (further providers, the *_CONFIG seams - see
      # docs/configuration.md) can be persisted in the platform-data volume
      # instead of a .env file, prompted for or set directly:
      #   docker compose -f oci://... run --rm --no-deps platform setup
      #   docker compose -f oci://... run --rm --no-deps platform setup OPENROUTER_MODELS_API_KEY=...
      # Values given here or in .env win over persisted ones, and a running
      # service restarts itself when the persisted file changes - see
      # docker/entrypoint.sh. An override file remains the other route:
      #   docker compose -f oci://... -f my-override.yml up -d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_MODELS_API_KEY: ${OPENROUTER_MODELS_API_KEY:-}
      VERCEL_MODELS_API_KEY: ${VERCEL_MODELS_API_KEY:-}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    volumes:
      - platform-data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Use node for the healthcheck since the slim image has no wget/curl
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  db-init:
    image: ${PLATFORM_INIT_IMAGE:-ghcr.io/chatbotkit/platform-studio-init:next}
    environment:
      PRISMA_DATABASE_URL: file:/data/chatbotkit.db
    volumes:
      - platform-data:/data
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # @note the qdrant image ships no curl or wget, so the check is bash
      # opening a TCP connection to the HTTP port
      test: ['CMD-SHELL', 'bash -c ": > /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      # @note the 10s healthcheck logs three INFO lines per run; keep only
      # warnings and errors
      RUST_LOG: warn
    ports:
      # @note the local browser uses presigned URLs (see x-storage-env);
      # containers reach the same port through the Docker network alias
      - '127.0.0.1:${STORAGE_PORT:-31900}:${STORAGE_PORT:-31900}'
    networks:
      default:
        aliases:
          - cbk-storage.localhost
    configs:
      - source: garage-config
        target: /etc/garage.toml
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      # @note the image is a bare binary - no shell - so the check is the
      # garage CLI talking to the daemon over RPC
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage-init:
    # @note one-shot: provisions the single-node layout, the development
    # access key and one bucket per storage scope through Garage's admin API.
    # Idempotent, so it reruns harmlessly on every `up`. The script ships
    # inside the initializer image (the same one db-init runs), so this stack
    # needs no bind mount into a checkout.
    image: ${PLATFORM_INIT_IMAGE:-ghcr.io/chatbotkit/platform-studio-init:next}
    command: ['node', '/garage-init.mjs']
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-admin-token}
      GARAGE_S3_URL: http://garage:${STORAGE_PORT:-31900}
      # @note origins allowed to use presigned URLs from a browser; the URLs
      # themselves are the access control
      STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-*}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    volumes:
      # @note shares the application volume so the generated access key
      # persists where the application entrypoint can source it
      - platform-data:/data
    depends_on:
      garage:
        condition: service_healthy
    restart: 'no'

configs:
  # @note the inline copy of docker/garage/garage.toml, embedded so the
  # published OCI artifact is self-contained. Keep the two in sync.
  garage-config:
    content: |
      # Garage (S3-compatible object storage) - single-node configuration.
      #
      # WARNING: the rpc_secret and admin token default to known development
      # values. Neither the RPC nor the admin port is published outside the
      # compose network (the S3 port is), but a hardened setup overrides them (GARAGE_RPC_SECRET, `openssl rand -hex
      # 32`, and GARAGE_ADMIN_TOKEN) - and a real deployment almost certainly
      # runs a real store with replication rather than this single-node
      # layout.

      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:-1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec}"

      [s3_api]
      # @note the region is part of every SigV4 signature: STORAGE_REGION
      # must match it, or every request fails authentication
      s3_region = "garage"
      api_bind_addr = "[::]:${STORAGE_PORT:-31900}"
      root_domain = ".s3.garage.localhost"

      [admin]
      # @note the garage-init service provisions the layout, the access key
      # and the buckets through this API
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:-dev-admin-token}"

volumes:
  platform-data:
  redis-data:
  qdrant-data:
  garage-data:
