# =============================================================================
# ChatBotKit Platform - community distribution stack
# =============================================================================
# The self-contained, image-only Compose application published to
# ghcr.io/chatbotkit/platform-community as an OCI artifact. Consumers run the
# whole platform - application, database initialization, Redis, Qdrant and
# Garage object storage - with a single command and no checkout:
#
#   docker compose -f oci://ghcr.io/chatbotkit/platform-community:latest up
#
# The same file runs directly from the repository:
#
#   docker compose -f docker/distro/community/compose.yml up -d
#
# Everything a service needs travels inside this file or inside a published
# image: configuration is inlined through the top-level `configs` element and
# the Garage provisioning script ships inside the initializer image, so there
# are no bind mounts - the one restriction `docker compose publish` enforces.
# The developer stack with profiles, source builds and hot reload lives in
# docker-compose.yml at the repository root; this file never builds anything.
#
# One folder per package flavor lives under docker/distro/. Each publishes as
# ghcr.io/chatbotkit/platform-<flavor>, pinned by CI to the matching
# application and initializer image digests of the same flavor.
# =============================================================================

# @note the storage environment every application service shares. The store
# is Garage, spoken to over the plain S3 protocol. Left empty, the access key
# is generated by Garage on first boot and persisted in the platform-data
# volume (garage-init provisions it, the application entrypoint sources it);
# set STORAGE_ACCESS_KEY_ID / STORAGE_SECRET_ACCESS_KEY to use a fixed pair.
#
# @note presigned upload/download URLs carry this endpoint, so a browser on
# the host needs to resolve it too: add `127.0.0.1 garage` to /etc/hosts to
# use browser-facing file flows.
x-storage-env: &storage-env
  SERVICE_AWS_ENDPOINT: http://garage:3900
  SERVICE_AWS_REGION: garage
  SERVICE_AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
  SERVICE_AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
  SERVICE_AWS_FORCE_PATH_STYLE: 'true'
  FILE_S3_BUCKET_NAME: file
  IMAGE_S3_BUCKET_NAME: image
  VIDEO_S3_BUCKET_NAME: video
  AUDIO_S3_BUCKET_NAME: audio
  CONVERSATION_S3_BUCKET_NAME: conversation
  NAMESPACE_S3_BUCKET_NAME: namespace
  SESSION_S3_BUCKET_NAME: session
  SPACE_S3_BUCKET_NAME: space
  TEMP_S3_BUCKET_NAME: temp
  OUTPUT_S3_BUCKET_NAME: output

services:
  platform:
    image: ${PLATFORM_IMAGE:-ghcr.io/chatbotkit/platform-community-app:next}
    ports:
      - '3000:3000'
    environment:
      <<: *storage-env
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # @note deployment-issued subdomains; must match the apexes baked into
      # the image (docker/Dockerfile). Browsers resolve `*.localhost` to
      # loopback, so `acme.space.localhost:3000` works with no DNS setup
      SPACE_APEX: ${SPACE_APEX:-space.localhost}
      PORTAL_APEX: ${PORTAL_APEX:-portal.localhost}
      # @note left empty, the image generates these secrets on first boot and
      # persists them in the platform-data volume; set explicitly to override
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      QUEUE_SECRET: ${QUEUE_SECRET:-}
      JWT_TOKEN_SECRET_KEY: ${JWT_TOKEN_SECRET_KEY:-}
      PRISMA_DATABASE_URL: file:/data/chatbotkit.db
      # @note optional: encrypts stored credentials in the database; unset,
      # they are stored as given. See docs/configuration.md, "Encryption at rest"
      PRISMA_FIELD_ENCRYPTION_KEY: ${PRISMA_FIELD_ENCRYPTION_KEY:-}
      # @note optional platform-wide provider keys; users can also supply
      # their own keys through the application itself. Any variable the
      # application honours (further providers, the *_CONFIG seams - see
      # docs/configuration.md) can be persisted in the platform-data volume
      # instead of a .env file, prompted for or set directly:
      #   docker compose -f oci://... run --rm --no-deps platform setup
      #   docker compose -f oci://... run --rm --no-deps platform setup OPENROUTER_MODELS_API_KEY=...
      # Values given here or in .env win over persisted ones - see
      # docker/entrypoint.sh. An override file remains the other route:
      #   docker compose -f oci://... -f my-override.yml up -d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_MODELS_API_KEY: ${OPENROUTER_MODELS_API_KEY:-}
      VERCEL_MODELS_API_KEY: ${VERCEL_MODELS_API_KEY:-}
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
    volumes:
      - platform-data:/data
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Use node for the healthcheck since the alpine image has no wget/curl
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  db-init:
    image: ${PLATFORM_INIT_IMAGE:-ghcr.io/chatbotkit/platform-community-init:next}
    environment:
      PRISMA_DATABASE_URL: file:/data/chatbotkit.db
    volumes:
      - platform-data:/data
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # @note the qdrant image ships no curl or wget, so the check is bash
      # opening a TCP connection to the HTTP port
      test: ['CMD-SHELL', 'bash -c ": > /dev/tcp/127.0.0.1/6333" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    ports:
      # @note published on localhost so presigned URLs (which carry the
      # garage:3900 endpoint) work from a host browser with the /etc/hosts
      # entry described above
      - '127.0.0.1:3900:3900'
    configs:
      - source: garage-config
        target: /etc/garage.toml
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      # @note the image is a bare binary - no shell - so the check is the
      # garage CLI talking to the daemon over RPC
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  garage-init:
    # @note one-shot: provisions the single-node layout, the development
    # access key and one bucket per storage scope through Garage's admin API.
    # Idempotent, so it reruns harmlessly on every `up`. The script ships
    # inside the initializer image (the same one db-init runs), so this stack
    # needs no bind mount into a checkout.
    image: ${PLATFORM_INIT_IMAGE:-ghcr.io/chatbotkit/platform-community-init:next}
    command: ['node', '/garage-init.mjs']
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-dev-admin-token}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    volumes:
      # @note shares the application volume so the generated access key
      # persists where the application entrypoint can source it
      - platform-data:/data
    depends_on:
      garage:
        condition: service_healthy
    restart: 'no'

configs:
  # @note the inline copy of docker/garage/garage.toml, embedded so the
  # published OCI artifact is self-contained. Keep the two in sync.
  garage-config:
    content: |
      # Garage (S3-compatible object storage) - single-node configuration.
      #
      # WARNING: the rpc_secret and admin token default to known development
      # values. Neither port is published outside the compose network, but a
      # hardened setup overrides them (GARAGE_RPC_SECRET, `openssl rand -hex
      # 32`, and GARAGE_ADMIN_TOKEN) - and a real deployment almost certainly
      # runs a real store with replication rather than this single-node
      # layout.

      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"

      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret = "${GARAGE_RPC_SECRET:-1799bccfd7411eddcf9ebd316bc1f5287ad12a68094e1c6ac6abde7e6feae1ec}"

      [s3_api]
      # @note the region is part of every SigV4 signature: SERVICE_AWS_REGION
      # must match it, or every request fails authentication
      s3_region = "garage"
      api_bind_addr = "[::]:3900"
      root_domain = ".s3.garage.localhost"

      [admin]
      # @note the garage-init service provisions the layout, the access key
      # and the buckets through this API
      api_bind_addr = "[::]:3903"
      admin_token = "${GARAGE_ADMIN_TOKEN:-dev-admin-token}"

volumes:
  platform-data:
  redis-data:
  qdrant-data:
  garage-data:
