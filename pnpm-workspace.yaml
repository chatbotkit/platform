# Audit exceptions
# @todo upgrade tiptap to >=3.30.4 (v3 major, only app/apps/chat/components/
# ChatArea.jsx + Selector.jsx) once 3.31.0 clears the release age (Oct 1 2026),
# then drop the tiptap entry. qs >=6.16.0 clears on Sep 28 2026; drop the qs
# entries after `pnpm update -r qs`. None is reachable: qs only sits under
# codegen/outbound-encoding paths, tiptap attrs are never attacker-controlled.
# @todo fast-uri >=3.1.6 clears the release age on Sep 22 2026; run
# `pnpm update -r fast-uri` then drop the four fast-uri entries. Not reachable:
# fast-uri only backs ajv `format: uri` checks under prisma-zod-generator
# (codegen) and @modelcontextprotocol/sdk; nothing resolves or fetches with it.
auditConfig:
  ignoreGhsas:
    - GHSA-x5fp-wj9c-mxmx # qs array-limit bypass
    - GHSA-4mjr-xmp4-gh2g # qs isBuffer DoS
    - GHSA-cp6q-959q-f8rh # @tiptap/core mergeAttributes __proto__
    - GHSA-5jgf-p345-68v8 # fast-uri IDN host confusion
    - GHSA-f65p-4m7j-42xc # fast-uri IPv6 normalization SSRF
    - GHSA-fph4-wmhf-6fwf # fast-uri hostname percent-decoding SSRF
    - GHSA-jqff-g426-hqxp # fast-uri percent-encoded scheme host confusion

# Dependency installation
autoInstallPeers: false
publicHoistPattern:
  - '*eslint-plugin-*'
  - '@typescript-eslint/eslint-plugin'
  - better-sqlite3
  # @note the sandbox module reaches its AgentOS runtime through a dynamic
  # import of an ESM, transitive dependency. Next's standalone file tracing
  # only lays down a resolvable path for packages it can resolve from the
  # application at build time, as it does for better-sqlite3 above; hoisted,
  # the runtime, its native sidecar and its command packages travel into the
  # image
  - '@rivet-dev/*'
  - '@agentos-software/*'

# Workspace packages
packages:
  - 'packages/*'
  - 'platform'

# Dependency overrides
overrides:
  react: 19.2.8
  react-dom: 19.2.8
  # Keep shared type-system dependencies on the versions validated together.
  'zod@>=3.0.0 <4.0.0': 3.25.67
  '@modelcontextprotocol/sdk': 1.26.0
  '@hono/node-server': 1.19.15
  effect: 3.20.0
  hono: 4.13.2
  lodash: 4.18.1
  valibot: 1.4.2
  '@pothos/core': 4.8.1
  '@pothos/plugin-prisma': 4.10.0
  '@pothos/plugin-relay': 4.6.2
  '@pothos/plugin-simple-objects': 4.1.3
  '@prisma/adapter-better-sqlite3': 7.3.0
  '@prisma/client': 7.3.0
  # GHSA-3f6p-5ww8-9rcr: prisma pins mysql2 3.15.3; patched >=3.22.0
  mysql2: 3.23.2
  # GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx: express/body-parser under the
  # MCP SDK resolve qs 6.15.3; patched >=6.16.0
  qs: 6.16.0
  # GHSA-jqff-g426-hqxp and siblings: ajv resolves fast-uri 3.1.5; patched
  # >=3.1.6
  fast-uri: 3.1.6
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj: jest-transform-yaml resolves
  # js-yaml 4.1.0; patched >=4.3.1
  'js-yaml@>=4.0.0 <4.3.1': 4.3.1
  # GHSA-wf6x-7x77-mvgw, GHSA-xvcm-6775-5m9r: relay-compiler 12 pins immutable
  # 3.7.6; patched >=3.8.4
  'immutable@>=3.0.0 <3.8.4': 3.8.4
  graphql: 16.11.0
  graphql-yoga: 5.15.1
  openai: 6.21.0
  prisma: 7.3.0
  prisma-json-types-generator: 3.4.2
  prisma-zod-generator: 2.1.2
  '@metascraper/helpers>jsdom': 29.1.1
  '@chatbotkit/sdk': 1.39.0
  '@chatbotkit/react': 1.39.0
  '@chatbotkit/next': 1.30.0
  '@chatbotkit/fetch': 1.30.0
  '@chatbotkit/widget': 1.30.0
  react-icons: 5.5.0
  # @note colorthief is only used through its browser build; its node-side
  # sharp dependency is dead weight that drags libvips advisories in
  'colorthief>sharp': '-'
  'ndarray-pixels>sharp': '-'
  # @note the sandbox module needs AgentOS's VM runtime only; the coding-agent
  # adapters and cloud SDKs the package also declares are never imported by
  # the platform and would add ~600MB to every install
  '@rivet-dev/agentos-core>@agentos-software/claude-code': '-'
  '@rivet-dev/agentos-core>@agentos-software/codex-cli': '-'
