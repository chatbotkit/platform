name: Publish GHCR Platform

on:
  workflow_dispatch:

  # @note no `paths` filter here on purpose: the verify job must run on every
  # push to next so its check lands on the SHA the promotion pull request
  # (next -> main) requires - pull-request.yaml skips its own run for that
  # head branch, and every push to main is a source release whatever it
  # touches. Path filtering for the image build lives in the changes job
  # below instead.
  push:
    branches:
      - main
      - next

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-platform-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # @note every job is guarded to the canonical repository and its
  # `platform-*` siblings: a fork that pushes to main or next gets a clean
  # skip rather than a queued build against runners and a registry it does
  # not have.
  #
  # A push to main is a source release: publish tags the images with the
  # version from package.json and release tags the commit and publishes the
  # GitHub Release. The metadata is validated here first so nothing is tagged
  # from a version the changelog does not describe. On next the job is an
  # early warning only; a stale changelog must not hold back next images.
  metadata:
    if: >-
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      github.actor != 'github-actions[bot]'
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/release-metadata
        id: metadata

  # @note the trigger-level `paths` filter this job replaces could not coexist with
  # running verify on every next push, so the build-relevance decision is made
  # here from the actual diff of the push. Anything that prevents computing
  # that diff (a brand-new branch, a force push, a manual dispatch) falls back
  # to building - a spurious build is cheap, a silently skipped one is not.
  #
  # A build-relevant push whose tree was already built is not rebuilt either:
  # main only moves through the promotion pull request (next -> main), so its
  # merge commit carries the exact tree of a next head that build, verify and
  # publish already tagged as sha-<short>. That tag is reused and retagged by
  # the publish job instead of spending two 8-core runners on an identical
  # image. Any tree that no published tag matches falls back to a full build.
  #
  # A push to main that touches no build input still publishes: the `main`
  # channel images were built from a tree whose build inputs equal this one
  # (every main push since that build was non-build-relevant, by this same
  # test), so publish carries them under the release version tag without
  # minting channel or sha- tags for a tree it did not build.
  changes:
    if: >-
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      github.actor != 'github-actions[bot]'
    name: Detect build-relevant changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.diff.outputs.build }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7

      - name: Diff the push against build-relevant paths
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # @note keep this pattern list in sync with the inputs the Docker
          # build actually consumes (the former trigger paths filter)
          pattern='^(packages/|patches/|platform/|stubs/|docker/|\.dockerignore$|\.pnpmfile\.cjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/(publish-ghcr-platform|_verify)\.yaml$)'

          if [ "$GITHUB_EVENT_NAME" != "push" ] \
            || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git fetch --quiet --depth=1 origin "$BEFORE"
          then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE "$pattern"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # @note the build matrix is skipped as a whole, so reuse requires both
      # component images for every flavor at the same source revision
      - name: Resolve image prefix
        if: steps.diff.outputs.build == 'true'
        id: image
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          repository="${REPOSITORY_NAME,,}"
          echo "prefix=${REGISTRY}/${owner}/${repository}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.diff.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.diff.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # @note candidates are the pushed commit (a fast-forward or a re-run)
      # and its parents (the promotion merge, whose second parent is the next
      # head). A candidate counts only when its tree is byte-identical to the
      # pushed tree and every flavor's component images carry its sha- tag,
      # which only publish creates and only after verify passed
      - name: Find a published image of the same tree
        if: steps.diff.outputs.build == 'true'
        id: reuse
        env:
          # @note keep this list in sync with the build and publish matrices
          FLAVORS: community studio
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
        run: |
          tree=$(git rev-parse "${GITHUB_SHA}^{tree}")

          # @note the checkout is shallow, so parents are read from the raw
          # commit object; rev-list would report the grafted commit as a root
          parents=$(git cat-file -p "$GITHUB_SHA" | awk '/^parent /{print $2}')

          for candidate in "$GITHUB_SHA" $parents; do
            if [ "$candidate" != "$GITHUB_SHA" ]; then
              git fetch --quiet --depth=1 origin "$candidate" || continue
            fi

            [ "$(git rev-parse "${candidate}^{tree}")" = "$tree" ] || continue

            short="${candidate:0:7}"

            complete=true

            for flavor in $FLAVORS; do
              if ! docker buildx imagetools inspect "${IMAGE_PREFIX}-${flavor}-app:sha-${short}" >/dev/null 2>&1 \
                || ! docker buildx imagetools inspect "${IMAGE_PREFIX}-${flavor}-init:sha-${short}" >/dev/null 2>&1
              then
                complete=false
                break
              fi
            done

            if [ "$complete" = true ]; then
              echo "Reusing images built from ${candidate}"
              echo "reuse=${short}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "reuse=" >> "$GITHUB_OUTPUT"

  # @note `next` receives direct pushes, so nothing has vetted the code yet -
  # the quality gate runs alongside the image build and blocks publication,
  # not the build itself: build only pushes untagged per-architecture digests,
  # so nothing a consumer can reach exists until publish tags them. Running
  # both in parallel halves the wall-clock at the cost of build minutes spent
  # on a red gate. It runs on every next push, not just build-relevant ones,
  # so the promotion pull request always finds a verify check on the head
  # SHA. `main` only moves through pull requests that already passed the same
  # gate, so the job is skipped there.
  verify:
    if: >-
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      github.actor != 'github-actions[bot]' &&
      github.ref == 'refs/heads/next'
    uses: ./.github/workflows/_verify.yaml

  build:
    needs:
      - changes
    # @note deliberately not gated on verify: the two run in parallel and the
    # gate is applied at publish, the only job that makes an image reachable
    if: >-
      !cancelled() &&
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      needs.changes.outputs.build == 'true' &&
      needs.changes.outputs.reuse == '' &&
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    name: Build ${{ matrix.flavor.name }} (${{ matrix.architecture.name }})
    runs-on: ${{ matrix.architecture.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          # @note package selections are compile-time image flavors. Add a
          # flavor here only when its Docker target installs that exact package
          # configuration. Runtime services such as Redis are not flavors.
          - name: community
            application_target: application
            initializer_target: initializer
          # @note studio starts with the same package selection as community;
          # both share Docker targets until studio's implementation diverges
          - name: studio
            application_target: application
            initializer_target: initializer
        architecture:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest-8-cores-amd64
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-latest-8-cores-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      # @note the naming grammar is <repository>-<flavor>[-<component>], with
      # the tag carrying only the build axis (channel or sha). The bare
      # <repository>-<flavor> name is the Compose distribution artifact -
      # the one consumers type - and -app/-init are its digest-pinned
      # component images.
      - name: Resolve image names
        id: image
        env:
          FLAVOR: ${{ matrix.flavor.name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          repository="${REPOSITORY_NAME,,}"
          stack="${REGISTRY}/${owner}/${repository}-${FLAVOR}"
          echo "stack=${stack}" >> "$GITHUB_OUTPUT"
          echo "application=${stack}-app" >> "$GITHUB_OUTPUT"
          echo "initializer=${stack}-init" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract application metadata
        id: application-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.application }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push application image
        id: application
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.flavor.application_target }}
          platforms: ${{ matrix.architecture.platform }}
          # @note distribution images embed full source maps on purpose - the
          # source is public and self-hosted debugging needs them
          build-args: |
            BUILD_SOURCEMAPS=full
          labels: ${{ steps.application-metadata.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.application }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.event.repository.name }}-${{ matrix.flavor.name }}-application-${{ matrix.architecture.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ matrix.flavor.name }}-application-${{ matrix.architecture.name }}

      - name: Extract initializer metadata
        id: initializer-metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.initializer }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push initializer image
        id: initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.flavor.initializer_target }}
          platforms: ${{ matrix.architecture.platform }}
          build-args: |
            BUILD_SOURCEMAPS=full
          labels: ${{ steps.initializer-metadata.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.initializer }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ github.event.repository.name }}-${{ matrix.flavor.name }}-application-${{ matrix.architecture.name }}
            type=gha,scope=${{ github.event.repository.name }}-${{ matrix.flavor.name }}-initializer-${{ matrix.architecture.name }}
          cache-to: type=gha,mode=max,scope=${{ github.event.repository.name }}-${{ matrix.flavor.name }}-initializer-${{ matrix.architecture.name }}

      - name: Smoke-test published images
        env:
          APPLICATION_IMAGE: ${{ steps.image.outputs.application }}@${{ steps.application.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture.name }}
          FLAVOR: ${{ matrix.flavor.name }}
          INITIALIZER_IMAGE: ${{ steps.image.outputs.initializer }}@${{ steps.initializer.outputs.digest }}
          PLATFORM: ${{ matrix.architecture.platform }}
        run: |
          container="platform-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FLAVOR}-${ARCHITECTURE}"
          volume="platform-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${FLAVOR}-${ARCHITECTURE}"

          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm --force "$volume" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker volume create "$volume"
          docker run --rm \
            --platform "$PLATFORM" \
            --env PRISMA_DATABASE_URL=file:/data/platform.db \
            --volume "$volume:/data" \
            "$INITIALIZER_IMAGE"

          # @note SITE_URL deliberately differs from the image's build-time
          # value so the probe below proves the runtime environment actually
          # reaches the served pages - a build-time bake cannot pass it
          docker run --detach \
            --platform "$PLATFORM" \
            --name "$container" \
            --env NEXTAUTH_SECRET=published-image-smoke-test \
            --env NEXTAUTH_URL=http://smoke-test.invalid \
            --env PRISMA_DATABASE_URL=file:/data/platform.db \
            --env QUEUE_SECRET=published-image-smoke-test \
            --env SITE_URL=http://smoke-test.invalid \
            --volume "$volume:/data" \
            "$APPLICATION_IMAGE"

          # @note /signin renders per request, so its markup must carry the
          # runtime site host stamped by the request context
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:3000/signin').then(async (response) => { const body = await response.text(); process.exit(response.status < 500 && body.includes('smoke-test.invalid') ? 0 : 1) }).catch(() => process.exit(1))"
            then
              exit 0
            fi

            sleep 2
          done

          docker logs "$container"
          exit 1

      # @note matrix job outputs cannot be aggregated reliably, so digest
      # marker files carry both architecture results into the publish job
      - name: Export image digests
        env:
          APPLICATION_DIGEST: ${{ steps.application.outputs.digest }}
          INITIALIZER_DIGEST: ${{ steps.initializer.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/platform-digests/application"
          mkdir -p "$RUNNER_TEMP/platform-digests/initializer"
          touch "$RUNNER_TEMP/platform-digests/application/${APPLICATION_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/platform-digests/initializer/${INITIALIZER_DIGEST#sha256:}"

      - name: Upload image digests
        uses: actions/upload-artifact@v7
        with:
          name: platform-digests-${{ matrix.flavor.name }}-${{ matrix.architecture.name }}
          path: ${{ runner.temp }}/platform-digests
          retention-days: 1

  publish:
    # @note this is where the quality gate bites: a failed verify on next
    # leaves the build's untagged digests unreachable in the registry and
    # publishes nothing. !cancelled() + accepting the skipped verify is
    # required: the implicit success() looks at the whole needs chain, and
    # verify is skipped on main. A skipped build is accepted when the changes
    # job found a published sha- tag of the same tree to retag, or on main
    # when nothing build-relevant changed and the `main` channel images stand
    # in (see the changes job). On main the release metadata must be valid,
    # since the version becomes an image tag here.
    if: >-
      !cancelled() &&
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      (
        needs.build.result == 'success' ||
        (needs.build.result == 'skipped' && needs.changes.outputs.reuse != '') ||
        (needs.build.result == 'skipped' && needs.changes.outputs.build == 'false' && github.ref == 'refs/heads/main')
      ) &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (github.ref != 'refs/heads/main' || needs.metadata.result == 'success') &&
      github.actor != 'github-actions[bot]' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    name: Publish ${{ matrix.flavor.name }}
    needs:
      - metadata
      - changes
      - build
      - verify
    runs-on: ${{ matrix.flavor.runner }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          # @note keep this list in sync with the build job's flavor matrix
          - name: community
            runner: ubuntu-latest-8-cores-amd64
          - name: studio
            runner: ubuntu-latest-8-cores-amd64

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Resolve image names
        id: image
        env:
          FLAVOR: ${{ matrix.flavor.name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="${REPOSITORY_OWNER,,}"
          repository="${REPOSITORY_NAME,,}"
          stack="${REGISTRY}/${owner}/${repository}-${FLAVOR}"
          echo "stack=${stack}" >> "$GITHUB_OUTPUT"
          echo "application=${stack}-app" >> "$GITHUB_OUTPUT"
          echo "initializer=${stack}-init" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # @note `docker compose publish` requires Compose v2.34 or newer; the
      # runner's bundled plugin is not guaranteed to be that new
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: platform-digests-${{ matrix.flavor.name }}-*
          path: ${{ runner.temp }}/platform-digests
          merge-multiple: true

      # @note with a reused build the source is the already multi-platform
      # sha- manifest list, which imagetools copies under the new tags; a
      # fresh build supplies one per-architecture digest per image instead.
      # A main push without build-relevant changes carries the `main`
      # channel images under the release version tag only: channel and sha-
      # tags name the tree an image was built from, and this is not it.
      - name: Create multi-platform image manifests
        id: manifest
        env:
          APPLICATION_IMAGE: ${{ steps.image.outputs.application }}
          BUILD: ${{ needs.changes.outputs.build }}
          CHANNEL: ${{ github.ref_name }}
          DIGESTS_DIR: ${{ runner.temp }}/platform-digests
          INITIALIZER_IMAGE: ${{ steps.image.outputs.initializer }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          REUSE: ${{ needs.changes.outputs.reuse }}
        run: |
          if [ "$BUILD" = "false" ]; then
            application_sources=("${APPLICATION_IMAGE}:${CHANNEL}")
            initializer_sources=("${INITIALIZER_IMAGE}:${CHANNEL}")
          elif [ -n "$REUSE" ]; then
            application_sources=("${APPLICATION_IMAGE}:sha-${REUSE}")
            initializer_sources=("${INITIALIZER_IMAGE}:sha-${REUSE}")
          else
            application_sources=()
            for digest_file in "$DIGESTS_DIR"/application/*; do
              [ -f "$digest_file" ] || continue
              application_sources+=("${APPLICATION_IMAGE}@sha256:$(basename "$digest_file")")
            done

            initializer_sources=()
            for digest_file in "$DIGESTS_DIR"/initializer/*; do
              [ -f "$digest_file" ] || continue
              initializer_sources+=("${INITIALIZER_IMAGE}@sha256:$(basename "$digest_file")")
            done

            if [ "${#application_sources[@]}" -ne 2 ] || [ "${#initializer_sources[@]}" -ne 2 ]; then
              echo "Expected two architecture digests for each image" >&2
              exit 1
            fi
          fi

          short_sha="${GITHUB_SHA:0:7}"
          application_tags=()
          initializer_tags=()

          if [ "$BUILD" != "false" ]; then
            application_tags+=(--tag "${APPLICATION_IMAGE}:${CHANNEL}" --tag "${APPLICATION_IMAGE}:sha-${short_sha}")
            initializer_tags+=(--tag "${INITIALIZER_IMAGE}:${CHANNEL}" --tag "${INITIALIZER_IMAGE}:sha-${short_sha}")
          fi

          if [ "$CHANNEL" = "main" ]; then
            if [ "$BUILD" != "false" ]; then
              application_tags+=(--tag "${APPLICATION_IMAGE}:latest")
              initializer_tags+=(--tag "${INITIALIZER_IMAGE}:latest")
            fi

            # @note the release version tag is the one consumers pin; the
            # release job below only runs once every flavor carries it
            application_tags+=(--tag "${APPLICATION_IMAGE}:v${RELEASE_VERSION}")
            initializer_tags+=(--tag "${INITIALIZER_IMAGE}:v${RELEASE_VERSION}")
          fi

          docker buildx imagetools create "${application_tags[@]}" "${application_sources[@]}"
          docker buildx imagetools create "${initializer_tags[@]}" "${initializer_sources[@]}"

          application_digest=$(docker buildx imagetools inspect "${application_sources[0]}" --format '{{.Manifest.Digest}}')
          initializer_digest=$(docker buildx imagetools inspect "${initializer_sources[0]}" --format '{{.Manifest.Digest}}')
          echo "application_digest=${application_digest}" >> "$GITHUB_OUTPUT"
          echo "initializer_digest=${initializer_digest}" >> "$GITHUB_OUTPUT"

      # @note the one-command distribution route: the flavor's Compose file is
      # published as an OCI artifact under <repository>-<flavor>, with every
      # image reference resolved to a digest so the artifact tag identifies an
      # exact, immutable stack. Consumers run:
      #
      #   docker compose -f oci://ghcr.io/chatbotkit/platform-community:latest up
      - name: Publish Compose distribution artifact
        id: artifact
        env:
          APPLICATION_IMAGE: ${{ steps.image.outputs.application }}@${{ steps.manifest.outputs.application_digest }}
          BUILD: ${{ needs.changes.outputs.build }}
          CHANNEL: ${{ github.ref_name }}
          FLAVOR: ${{ matrix.flavor.name }}
          INITIALIZER_IMAGE: ${{ steps.image.outputs.initializer }}@${{ steps.manifest.outputs.initializer_digest }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          STACK_IMAGE: ${{ steps.image.outputs.stack }}
        run: |
          publish() {
            PLATFORM_IMAGE="$APPLICATION_IMAGE" \
            PLATFORM_INIT_IMAGE="$INITIALIZER_IMAGE" \
              docker compose --file "docker/distro/${FLAVOR}/compose.yml" \
                publish -y --resolve-image-digests "$1"
            echo "reference=$1" >> "$GITHUB_OUTPUT"
          }

          if [ "$BUILD" != "false" ]; then
            publish "${STACK_IMAGE}:${CHANNEL}"
          fi

          if [ "$CHANNEL" = "main" ]; then
            if [ "$BUILD" != "false" ]; then
              publish "${STACK_IMAGE}:latest"
            fi

            publish "${STACK_IMAGE}:v${RELEASE_VERSION}"
          fi

      # @note the last artifact published is the one checked: on main that is
      # the release version, elsewhere the channel
      - name: Smoke-test published distribution artifact
        env:
          REFERENCE: ${{ steps.artifact.outputs.reference }}
        run: |
          docker compose --file "oci://${REFERENCE}" config --quiet

  # @note the release exists only once every flavor's images and Compose
  # artifact carry the version tag: a GitHub Release whose images are missing
  # or still building would mislead operators pinning the version. The Git tag
  # and the GitHub Release are created from the exact merge commit; on a
  # retry an annotated tag already pointing at it is accepted, and a tag
  # pointing elsewhere fails without being moved. The only write token in
  # this workflow that reaches the repository lives here.
  release:
    name: Publish GitHub release
    needs:
      - metadata
      - changes
      - publish
    if: >-
      !cancelled() &&
      (github.repository == 'chatbotkit/platform' || startsWith(github.repository, 'chatbotkit/platform-')) &&
      needs.metadata.result == 'success' &&
      needs.publish.result == 'success' &&
      github.actor != 'github-actions[bot]' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Require protected main for releases
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          if [ "$REF_PROTECTED" != 'true' ]; then
            echo 'Source releases require branch protection or an active ruleset on main.' >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # @note tag the triggering merge, even if main has advanced since
          ref: ${{ github.sha }}
          fetch-tags: true

      - uses: ./.github/actions/release-metadata
        id: metadata

      - name: Create and push the source snapshot
        env:
          NOTES_PATH: ${{ steps.metadata.outputs.notes-path }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo 'The checkout must identify the triggering merge commit' >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'The release checkout must be clean' >&2
            exit 1
          fi

          if [ -n "$(git tag --list "$TAG")" ]; then
            if [ "$(git cat-file -t "$TAG")" != 'tag' ] || [ "$(git rev-parse "${TAG}^{commit}")" != "$GITHUB_SHA" ]; then
              echo "${TAG} already exists for another snapshot. Update package.json and CHANGELOG.md." >&2
              exit 1
            fi
            echo "Snapshot ${TAG} already identifies ${GITHUB_SHA}"
          else
            { printf 'Platform %s\n\n' "$VERSION"; cat "$NOTES_PATH"; } | git tag -a "$TAG" "$GITHUB_SHA" -F -
          fi

          git push origin "refs/tags/${TAG}:refs/tags/${TAG}"

      - name: Publish release with changelog notes
        uses: actions/github-script@v9
        env:
          NOTES_PATH: ${{ steps.metadata.outputs.notes-path }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        with:
          script: |
            const { readFileSync } = require('node:fs')
            const { NOTES_PATH, TAG: tag, VERSION: version } = process.env
            const name = `Platform ${version}`
            const body = readFileSync(NOTES_PATH, 'utf8').trim()

            // @note require the pushed annotated tag to still identify the verified commit
            const { data: ref } = await github.rest.git.getRef({
              ...context.repo, ref: `tags/${tag}`,
            })
            if (ref.object.type !== 'tag') {
              throw new Error(`${tag} must be an annotated tag`)
            }
            const { data: annotation } = await github.rest.git.getTag({
              ...context.repo, tag_sha: ref.object.sha,
            })
            if (annotation.object.type !== 'commit' || annotation.object.sha !== context.sha) {
              throw new Error(`${tag} does not identify the verified release commit`)
            }

            let existing
            try {
              const response = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              })
              existing = response.data
            } catch (error) {
              if (error.status !== 404) throw error
            }

            if (existing) {
              if (existing.draft || existing.prerelease || existing.name !== name ||
                  (existing.body ?? '').replace(/\r\n/g, '\n').trim() !== body) {
                throw new Error(`Existing release ${tag} differs from the verified release metadata`)
              }
              core.info(`Release already published: ${existing.html_url}`)
              return
            }

            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name,
              body,
              draft: false,
              prerelease: false,
              make_latest: 'legacy',
            })
            core.info(`Published release: ${release.html_url}`)
