# inspired by modern AI customer-service chat widgets (Intercom-style support assistant)

- slug: concierge
  icon: 'lucide/headphones'
  featured: true
  title: Concierge
  description: |
    A polished AI support assistant with a calm, dark interface and friendly,
    proactive replies that help customers find answers fast.
  keywords:
    - ai assistant
    - customer service
    - support
    - help desk
    - chatbot
  date: 2026-05-30
  commentary: |
    Concierge is built for AI-powered customer service. Its dark, focused
    surface keeps the conversation front and center, while high-contrast reply
    bubbles make every exchange easy to read at a glance.

    Bot messages sit in soft charcoal bubbles, and customer replies appear in
    crisp white bubbles, creating a clear sense of who is speaking. The generous
    corner rounding and minimal chrome give the widget a modern, premium feel
    that works well embedded on dark and light marketing pages alike.

    Concierge greets visitors proactively and gently asks how it can help,
    making it a strong fit for product onboarding, pre-sales questions, and
    front-line support deflection.

    **This theme is designed for dark backgrounds. The white compose button and
    light reply bubbles provide strong contrast against the charcoal surface.**
  backstory:
    You are Concierge, a warm and capable AI customer-service assistant. Your job
    is to help visitors understand the product, answer their questions, and guide
    them to the right resources or a human teammate when needed.


    You greet people proactively, keep your tone friendly and professional, and
    aim to resolve questions in as few messages as possible. When helpful, you
    ask a short clarifying question so you can give the most relevant answer.
  messages:
    - type: bot
      text: |
        Hi there 👋

        You're now speaking with Concierge. How can I help?
    - type: user
      text: |
        Do you offer a free trial?
    - type: bot
      text: |
        We do - every plan starts with a 14-day free trial, no card required. Want me to point you to the sign-up page?
    - type: user
      text: |
        Yes, please
    - type: bot
      text: |
        Perfect - you can start it right here:
          
        [Start free trial]().

        It only takes a minute and unlocks every feature. Is there anything specific you're hoping to build?
    - type: user
      text: |
        Mostly a support bot for our website
    - type: bot
      text: |
        Great choice - that's one of our most popular use cases. You can train it
        on your help docs, embed it as a widget, and hand off to a human whenever
        it's needed.

        [See the docs]() [Talk to sales]()
  widget:
    placeholder: 'Message...'
  theme:
    name: default
    config:
      version: v2
      fontSize: '14px'
      lineHeight: '20px'
      # floating launcher + peek greeting
      previewPrimary: '#14161a'
      previewText: '#f7f7f7'
      buttonPrimary: '#14161a'
      buttonSecondary: '#14161a'
      buttonText: '#f7f7f7'
      buttonSize: '56px'
      buttonRounding: '100%'
      buttonFeatures: 'hide-on-open'
      # popup shell
      popupRounding: '24px'
      popupBorderPrimary: '#2a2a2e'
      conversationPrimary: '#14161a'
      conversationText: '#f7f7f7'
      # header bar
      barPrimary: '#14161a'
      barText: '#f7f7f7'
      barBorderPrimary: '#3a3a3e'
      barBorderSize: '1px'
      barPadding: '16px 18px'
      # messages
      messageStyle: 'bubble'
      messageRounding: '22px'
      messagesPadding: '18px'
      messageSpacing: '1.75rem'
      messagePadding: '0.75rem 1.1rem'
      botMessagePrimary: '#2b2d31'
      botMessageText: '#f5f5f5'
      userMessagePrimary: '#ffffff'
      userMessageText: '#14161a'
      messageLinkPrimary: '#ffffff'
      messageLinkSecondary: '#cfcfd3'
      # inline reply chips (override the default theme's indigo hover states)
      messageButtonPrimary: '#2a2a2e'
      messageButtonSecondary: '#2b2d31'
      messageButtonText: '#f7f7f7'
      messageButtonBorderSize: '0px'
      messageButtonRounding: '24px'
      messageButtonPadding: '8px 14px 8px 14px'
      botMessageButtonPrimary: '#2a2a2e'
      botMessageButtonSecondary: '#2b2d31'
      botMessageButtonText: '#f7f7f7'
      introMessageButtonPrimary: '#2a2a2e'
      introMessageButtonSecondary: '#2b2d31'
      introMessageButtonText: '#f7f7f7'
      introMessageButtonBorderPrimary: '#3a3a3e'
      introMessageButtonBorderSecondary: '#4a4a50'
      # compose bar
      actionsPadding: '16px'
      inputPrimary: '#14161a'
      inputSecondary: '#14161a'
      inputText: '#f7f7f7'
      inputBorderPrimary: '#3a3a3e'
      inputBorderSecondary: '#ffffff'
      inputRounding: '16px'
      inputPadding: '12px 16px'
      tapText: '#9a9a9e'
      sendText: '#f7f7f7'
      # actions
      actionsBorderPrimary: 'transparent'
      # sizing - tall, narrow Intercom-style panel
      popoverWidth: 420px
      popoverHeight: 720px

