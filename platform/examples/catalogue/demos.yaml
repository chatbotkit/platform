- slug: world-map
  icon: 'lucide/map'
  title: World Map
  description: |
    A chatbot that demonstrates the use of a world map to visualize data and
    provide geographical context.
  keywords:
    - world map
    - geography
    - data visualization
  date: 2025-10-07
  commentary: |
    The World Map bot demonstrates how to integrate an interactive 3D globe with
    an AI chatbot using client-side functions. This example showcases the power
    of combining natural language interactions with geographical visualization,
    allowing users to explore the world through conversation.

    Users can ask the bot to fly to specific locations by name (e.g., "take me
    to Paris") or coordinates, adjust the camera view with different zoom levels
    and angles, and ask questions about places around the world. The bot uses
    Mapbox GL JS to render a beautiful globe with atmosphere effects, making
    geographical exploration intuitive and engaging.

    This demo highlights how AI widgets can control external libraries and APIs
    through client-side functions, creating seamless integrations between
    conversational AI and interactive visualizations. The example serves as a
    practical template for building location-aware applications, travel planning
    tools, or educational geography experiences where users can naturally
    converse with an AI to explore the world.
  backstory: |
    ---
    skillset:
      name: Image Skills
      description: Skills related to fetching images
      abilities:
        - name: Search for Images
          description: Search for images based on a query
          instruction: |
            template: 'search/images'
    ---
