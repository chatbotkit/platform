- slug: form-autofill
  icon: 'lucide/file-pen'
  title: Form Autofill
  description: |
    A bot that demonstrates how to deploy a form autofill features into any
    website using AI Widgets.
  keywords:
    - form autofill
    - chatbot
    - user experience
  date: 2024-11-22
  commentary: |
    The Form Autofill bot is designed to showcase the use of AI Widgets to
    automate the form filling process on websites. By interacting with the bot,
    users can provide information that will be automatically populated in the
    form fields without manual input, streamlining the data entry process and
    enhancing user experience.

    This example highlights the seamless integration of AI Widgets with web
    forms, demonstrating the potential for chatbots to improve efficiency and
    convenience for users interacting with online forms. By leveraging the power
    of AI, businesses can enhance their customer experience and reduce
    friction in the data collection process.

    The demo showcases the capabilities of the Form Autofill bot and provides
    users with a hands-on experience of how AI Widgets can simplify form
    completion tasks. This example serves as a practical demonstration of how
    chatbots can enhance user interactions with web applications.

    The Form Autofill bot works with any form fields and can be customized to
    suit specific requirements, making it a versatile tool for automating data
    entry tasks on websites.
  messages:
    - type: user
      text: Help me fill out the form
    - type: bot
      text: |
        Sure! I can help you fill out the form. Can you let me know your name
        first?
    - type: user
      text: John Doe
    - type: bot
      text: |
        Hi Joe! Next, I need your email address. Please provide it below.
    - type: user
      text: john@doe.com
    - type: bot
      text: |
        Great! Lastly, I need your phone number
    - type: user
      text: 123-456-7890
    - type: bot
      text: |
        Thank you! I have successfully filled out the form with the provided
        information. You can now submit the form.
  backstory: RULES


    1. Use the provided functions to interact with the form fields and fill them
    out with the user's input.


    2. Make sure to list the fields you need to fill out before asking the user
    for the information. This will help the user understand what information is
    required. You must not print the form field names or descriptions in the
    chat as the user can already see them on the website!


    3. Only ask for known fields - not made-up ones. Check with the listFormFields
    function to see what fields are available. For example if the function
    listFormFields requires 3 fields to be filled, only ask for those 3 fields.


    4. Ask the user for each field of information separately and fill the form
    field with the provided information.


    5. Perform some form of validation on the user's input to ensure it is in the
    correct format. For example, check that an email address is in the correct
    format.


    Failure to follow these rules may result in a poor user experience and
    confusion for the user.
  model: gpt-4o-mini/temperature=0.1
  widget:
    intro: |
      The purpose of this demo is to showcase the use of AI Widgets to automate
      the form filling process on websites. By interacting with the bot, you can
      provide information that will be automatically populated in the form
      fields without manual input, streamlining the data entry process and
      enhancing user experience.
    initial: |
      Hello! I'm the Form Autofill bot. I can help you fill out forms on this
      website by automatically populating the fields with the information you
      provide. Let's get started!

      [Help me fill out the form]()
  theme: '@ai-answers'
  demo: true

