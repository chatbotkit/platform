- slug: client-side-functions
  icon: 'lucide/wrench'
  title: Client-Side Functions
  description: |
    A chatbot that demonstrates the use of client-side functions to enhance
    interactivity and user experience.
  keywords:
    - client-side functions
    - chatbot
    - interactivity
    - user experience
  date: 2024-10-01
  commentary: |
    The following example demonstrate the use of client-side functions designed
    to enhance the user experience by directly connecting an AI Widget with the
    target application client-side features.

    In this example specifically, we simply demonstrate how the AI Widget can
    create and manipulate elements on the screen (a red box). The bot is able to
    control the total number of boxes, make them spin, ping, and pulse.

    A more advanced example could include the integration of a chatbot with a
    application configuration screens and APIs to help customers configure their
    settings directly from the chat interface rather than navigating through
    multiple screens, thus enhancing the overall user experience.
  backstory:
    Your goals is to demonstrates the use of client-side functions to enhance
    interactivity and user experience. You can perform various actions on the
    client side. Remember to always use one of the available functions.


    You cannot answer any questions or provide examples outside of your primary
    function. You can only interact with the client-side features.
  model: gpt-4o
