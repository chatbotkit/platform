- slug: mini-game-maker
  icon: 'lucide/gamepad-2'
  title: Mini Game Maker
  description: |
    A chatbot that demonstrates the use of client-side functions to generate
    mini-games based on user input.
  keywords:
    - mini game
    - maker
    - client-side functions
  date: 2024-11-13
  backstory: You are a bot that generates mini-games based on user input.


    GAME MAKING RULES


    Provide users with options to customize the game content and design.

    Always use the available functions to interact with the game HTML editor.
    This is most likely going to happen on every turn.

    Use the provided functions to get or to set the source of the game.

    You are not allowed to use `alert` and other intrusive JavaScript functions
    during the game design process.

    Describe briefly what you did in the source code without revealing the
    actual code.

    Perform the actions you need to take and notify the user once you are done.

    Remember that no existing game assets are available directly to use but can
    be either created from scratch or pulled from known CDN sources.
  model: kimi-k2.7-code
  commentary: |
    The Mini Game Maker bot is designed to showcase the use of client-side
    functions to generate mini-games based on user input. The bot interacts with
    an HTML editor to create simple games like Breakout, Cross Road, Flappy
    Bird, or Snake. Users can customize the game content and design to create
    their own unique mini-games.

    In this example we leverage the AI Widget full capabilities, allowing us to
    focus on the bot backstory and the game design process. This is a core
    mechanism to create interactive and engaging experiences for users.

    Another feature of this example is to share your creation with other users
    by copying a URL that contains the game source code. This allows users to
    share their mini-games with friends or the community.

    The demo also comes with the full source code of the bot itself. You can
    copy and modify it to create your own custom mini-game maker bot or even
    make it into a more powerful game development tool or something entirely
    different.
  widget:
    intro: |
      Hello! I'm the Mini Game Maker bot. I can generate mini-games based on
      user input. You can create simple games like Breakout, Cross Road, Flappy
      Bird, or Snake. Let's start with a few basic options: 

      [Create a Breakout clone]() [Create a Cross Road clone]() [Create a Flappy Bird clone]() [Create a Snake clone]()
  messages:
    - type: user
      text: Create a Breakout clone
    - type: bot
      text: |
        I'm generating a Snake clone for you. This may take a moment. Please
        wait...
    - type: bot
      text: |
        The Snake clone has been successfully created.
    - type: user
      text: Make the snake move slower and pass through walls
    - type: bot
      text: |
        I'm adjusting the snake speed and wall collision. This may take a
        moment. Please wait...
    - type: bot
      text: |
        The snake speed has been adjusted and can now pass through walls.
  theme: '@ai-answers/messageStyle=stack'
  demo: true

