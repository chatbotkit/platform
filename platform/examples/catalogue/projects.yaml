- slug: terraform-code-foundry
  icon: 'lucide/code'
  title: Terraform Code Foundry (Multi-Account)
  description: |
    An autonomous code foundry on a multi-account architecture: one shared
    "tools" account holds the GitHub token-minter and an exported coding toolset,
    and each customer gets a thin child User whose Coding Agent installs those
    tools cross-account and works on the customer's own repo, scoped by context.
  keywords:
    - terraform
    - infrastructure-as-code
    - multi-account
    - coding-agent
    - github
    - run-as
    - cross-account-skillset
    - context
    - heartbeat
    - autonomous
  date: 2026-06-20
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/code-foundry
  commentary: |
    This example shows how to productise an autonomous agent to many users without
    duplicating the toolbox per user or scattering credentials. A single shared
    "tools" account holds the expensive, sensitive machinery once: a GitHub bot that
    mints repository-scoped GitHub App tokens (signed from a JWT secret), a Coding
    Tools skillset exported account-wide as global-coding-tools, shared Design and
    Coding spaces, and a Designs Manager that keeps designs synced. Each user gets a
    thin, isolated child User whose Coding Agent installs the shared toolset
    cross-account with an @shared@global-coding-tools reference.

    Everything runs on one parent User token. Each account is selected with a provider
    alias and run_as (the X-RunAs-UserId header), the same multi-account mechanism as
    the multi-tenant examples. The shared account must carry the alias `shared` so the
    cross-account skillset reference resolves.

    The agent never holds the GitHub App key. To touch a repo it asks the shared
    GitHub bot (via bot/apply) to mint a short-lived, repository-scoped token. Which
    repository is decided by the child User's context, not hard-coded - hard-coding
    would be a security risk because each agent belongs to a user who may interact
    with it. That is why the user context API is exposed via GraphQL, and
    why each child User is given a context with its repo and Vercel project. A
    heartbeat trigger keeps each coding agent making the next step on a long task.
  share: |-
    Build an autonomous code foundry with Terraform on a multi-account architecture - a shared "tools" account mints GitHub tokens and exports a coding toolset, and each customer's child User installs it cross-account and works on their own repo, scoped by context. One parent User token, run_as per account.

    https://chatbotkit.com/examples/terraform-code-foundry
  files: []

- slug: terraform-community-scout
  icon: 'lucide/radar'
  title: Terraform Community Scout
  description: |
    A product-led-growth agent that runs on a cycle to watch public conversations
    (Reddit today) for threads where your product genuinely helps, drafts a useful
    disclosed reply, and suggests it to the team on Slack for a human to post. It
    earns attention by being helpful, not by being loud.
  keywords:
    - terraform
    - infrastructure-as-code
    - reddit
    - slack
    - social-listening
    - product-led-growth
    - community
    - monitoring
    - skills
    - human-in-the-loop
    - marketing
  date: 2026-06-20
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/community-scout
  commentary: |
    This example applies the monitor-on-a-cycle pattern to social listening: an
    agent that watches public conversations for places where your product genuinely
    helps, drafts a useful contribution, and suggests it to the team on Slack for a
    human to post. It is built on ChatBotKit's first-class Reddit abilities for
    reading (search and feeds work over RSS with no authentication) and the Slack
    integration's start-conversation ability for the hand-off.

    The boundaries stay clean. Finding threads and reading them are tool calls; a
    small stdlib script dedups discovered threads so the same conversation is never
    re-scored or re-suggested; and the judgment - whether a thread is worth engaging,
    and what a genuinely helpful reply says - lives in SKILL.md playbooks the agent
    reads and follows. A watchlist.md config holds the product, keywords,
    subreddits, the team/Slack routing, and the engagement rules.

    The gate is structural. Because this is an automated agent, the human-in-the-loop
    is enforced by the toolset rather than a prompt: the scout has read-only Reddit
    tools and a Slack-suggest tool, and no Reddit-post tool at all. It physically
    cannot reply on Reddit - it can only suggest to the team, and a human posts. This
    matters more here than almost anywhere, because auto-posting marketing to Reddit
    is how accounts get banned and brands get burned.

    The whole thing is built to be welcome rather than spammy - a high relevance
    bar, one tailored reply per thread, affiliation disclosed every time, and
    subreddit rules respected. Other sources (LinkedIn, a news API, or X via the X
    API) can feed the same mention pipeline without changing the rest of it.
  share: |-
    Build a product-led-growth agent with Terraform - it watches Reddit on a cycle for conversations where your product genuinely helps, drafts a disclosed reply, and suggests it to the team on Slack for a human to post. The scout has no post tool, so the human-in-the-loop is structural, not just a prompt.

    https://chatbotkit.com/examples/terraform-community-scout
  files: []

- slug: terraform-soc-investigator
  icon: 'lucide/shield-alert'
  title: Terraform SOC Investigator
  description: |
    An autonomous security-operations agent that runs on a cycle: pull SIEM
    alerts, correlate them into cases, triage, investigate, enrich indicators,
    and accumulate knowledge. It is built to show one boundary - deterministic
    work lives in scripts the agent runs, judgment lives in SKILL.md playbooks
    the agent reads and follows.
  keywords:
    - terraform
    - infrastructure-as-code
    - security
    - soc
    - siem
    - alerts
    - investigation
    - skills
    - scripts
    - triggers
    - knowledge-base
    - approval-gate
  date: 2026-06-20
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/soc-investigator
  commentary: |
    This example models the agentic half of an open-source SOC platform: an
    analyst agent that runs on a schedule to pull SIEM alerts, correlate them
    into cases, triage, investigate the ones that matter, enrich indicators, and
    capture what it learns. It frees human analysts from alert fatigue so they
    spend their time on real threats and on the decisions that need a human.

    The example exists to make one boundary concrete - what should be
    deterministic code and what should be agent judgment. Pulling alerts,
    normalizing them, correlating them into cases, and looking up threat intel are
    high-volume and must be reliable, so they are stdlib Python scripts the agent
    runs with the shell tools, with no model in the loop. Which cases deserve
    attention, what actually happened, whether it is a real threat, and what to
    recommend are judgment, so they are SKILL.md playbooks the agent reads and
    follows. Skills are the unit of work either way: some wrap a deterministic
    script, some are reasoning playbooks.

    A real SOC ingests a stream of alerts; here that becomes a scheduled pull on a
    cycle, which fits triggers cleanly. A correlation UID plus a time bucket makes
    the pull idempotent, so re-polling the same window never duplicates a case or
    an alert. Cases and accumulated knowledge live as files in a workspace, so the
    example runs with no external dependencies, and the production seams - a real
    SIEM, a SIRP case database, a dataset-backed knowledge base - are marked in
    the code.

    One invariant is enforced rather than requested: the analyst investigates and
    recommends, but it never closes a case or executes remediation. Investigated
    cases are left pending human review. That approval gate is the deterministic
    guarantee around the agent's autonomy, and a SOC is exactly where it earns its
    keep.

    This is the pattern for any cyclic ingest, triage, investigate, and learn
    pipeline where the high-volume mechanics must be deterministic and reliable
    while the judgment stays agentic. It upgrades to the orchestrator-worker
    pattern for investigating many cases in parallel.
  share: |-
    Build an autonomous SOC analyst with Terraform - it runs on a cycle to pull SIEM alerts, correlate them into cases, triage, investigate, and learn. Deterministic work lives in scripts; judgment lives in skills; and a human approval gate keeps the agent recommending, never acting on its own.

    https://chatbotkit.com/examples/terraform-soc-investigator
  files: []

- slug: terraform-deep-researcher
  icon: 'lucide/telescope'
  title: Terraform Deep Researcher
  description: |
    An autonomous deep-research agent built as an orchestrator-worker team: a
    big-brain orchestrator decomposes a question, fans out worker agents that
    research in parallel, supervises and adapts as findings return, then
    synthesizes a cited report. The fan-out, waiting, and joining are runtime
    task operations the agents drive - the topology is declared, the
    orchestration is lived.
  keywords:
    - terraform
    - infrastructure-as-code
    - deep-research
    - research
    - orchestrator-worker
    - multi-agent
    - tasks
    - fan-out
    - parallel
    - synthesis
  date: 2026-06-20
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/deep-researcher
  commentary: |
    This example builds a deep-research agent in the shape of the modern
    orchestrator-worker pattern - the same architecture as systems like
    gpt-researcher. It deploys three roles, each authored as a small project of
    instruction files: an intake agent that turns a request into a commissioned
    job, a big-brain orchestrator that runs the research, and a worker that
    answers a single sub-question with web search and fetch.

    The key idea is that the orchestration lives in the orchestrator agent at
    runtime - the agent decides how to break the work down, fan out, wait, and
    recombine, rather than following a workflow graph baked into Terraform. The
    orchestrator decomposes the question into focused sub-questions, creates and
    runs a worker
    task for each (they execute in parallel), introspects their status and result
    summaries, adapts as findings arrive - going deeper on rich threads, pruning
    dead ends - and then synthesizes everything into one report. The fan-out and
    the join are ordinary task abilities the agent calls (create, run, list,
    fetch). Terraform declares only the stable topology: the agents, their tools,
    the shared workspace, and the entry surface. The research tasks themselves are
    runtime artifacts the agents spawn on demand.

    Results flow through a shared space used as a blackboard - workers write cited
    findings, the orchestrator reads them back and writes the final report - plus
    each task's generated summary and full final output. Each bot carries its own
    model, so the team uses opus to orchestrate and synthesize and a lighter model
    for the legwork, and per-task time and iteration limits keep "research until
    satisfied" bounded.

    This is the pattern for open-ended research where the plan should adapt to the
    question and the agents themselves should own how the work is broken down and
    recombined.
  share: |-
    Build a deep-research agent with Terraform - an orchestrator-worker team that decomposes a question, fans out workers to research in parallel, and synthesizes a cited report. The orchestration is agent-driven at runtime through tasks; Terraform declares the agents, tools, and shared workspace.

    https://chatbotkit.com/examples/terraform-deep-researcher
  files: []

- slug: terraform-two-sided-marketplace
  icon: 'lucide/handshake'
  title: Terraform Two-Sided Marketplace
  description: |
    A two-sided market modelled the way a recruitment agency works: two agents,
    one per side - a Talent Partner that works for candidates and a Client
    Partner that works for hiring companies - over a shared external matching
    engine they reach with the fetch action.
  keywords:
    - terraform
    - infrastructure-as-code
    - two-sided-marketplace
    - marketplace
    - multi-agent
    - recruitment
    - matching
    - fetch
    - on-behalf-of
    - shared-secret
  date: 2026-06-19
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/two-sided-marketplace
  commentary: |
    This example models a two-sided market the way a recruitment agency works:
    one side has people to place, the other has roles to fill, and the market
    clears between them. It deploys two agents, one per side - a Talent Partner
    that works for candidates, and a Client Partner that works for hiring
    companies.

    The matching engine stays out of the agents. The role index, talent pool,
    submissions, and the placement fee live in your own marketplace service, and
    both agents reach it with the fetch action. ChatBotKit is the conversational
    and identity tier on each side; your API is the shared system of record. This
    is the right division for a marketplace: the proprietary logic and the money
    stay in a service you control, and the agents are thin clients over it.

    The two agents never talk to each other. They have opposite loyalties, so
    they meet only through shared state. The Talent Partner submits a candidate
    into a role; that submission surfaces in the Client Partner's review queue;
    the Client Partner advances it to interview, offer, or placement. The advance
    is a deterministic server-side transaction - the agent requests it, the API
    decides and records it - which keeps consent, auditability, and billing in
    the core.

    Identity uses one shared gateway token plus a personal OAuth secret per side.
    Both desks present the same shared service token to get past the marketplace
    gateway, so the core sees one stable caller. Each desk attributes actions to
    a different human - the candidate on one side, the employer contact on the
    other - through its own personal OAuth secret, so the core enforces what that
    person may see and do.

    This is the pattern for any two-sided product - hiring, freelance work,
    lending, rentals, B2B procurement - where supply and demand each deserve
    their own agent and the matching belongs to a service both sides share.
  share: |-
    Model a two-sided market with Terraform - a Talent Partner for candidates and a Client Partner for companies, each its own agent, meeting only through a shared marketplace API. The matching engine and the placement fee stay in your service; the agents are thin clients with per-side on-behalf identity.

    https://chatbotkit.com/examples/terraform-two-sided-marketplace
  files: []

- slug: terraform-internal-services-fetch
  icon: 'lucide/key-round'
  title: Terraform Internal Services (Fetch + Secrets)
  description: |
    An agent that reaches your internal corporate services with the fetch action,
    authenticated by two kinds of secret: a shared service token for
    machine-to-machine calls, and a personal OAuth secret so the agent can act on
    behalf of the signed-in employee.
  keywords:
    - terraform
    - infrastructure-as-code
    - fetch
    - secrets
    - oauth
    - shared-secret
    - personal-secret
    - internal-api
    - service-account
    - on-behalf-of
  date: 2026-06-19
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/internal-services-fetch
  commentary: |
    This example shows the two ways an agent authenticates when it calls your
    internal services with the fetch action, and when to reach for each.

    A shared secret is the agent's own machine identity. It is one account-wide
    bearer token the agent presents to internal systems that trust it as a
    service account - no human in the loop, the same identity on every
    conversation. Use it for read-only platform data that everyone may see, like
    a service catalogue or health endpoint.

    A personal OAuth secret represents the employee talking to the agent. The
    first time someone triggers an ability that uses it, ChatBotKit asks them to
    sign in through your SSO and stores their token; the agent then calls
    permission-enforcing systems as that employee, so the backend applies its
    normal access control. Use it for anything scoped to the person - their
    tickets, their time-off balance, opening an incident in their name.

    The abilities are written in the structured fetch format (a !fetch action tag
    with !string parameters and !reference secret helpers). Secrets resolve to a
    complete Authorization value including the Bearer scheme, so headers carry the
    reference directly with no manual prefix. The open_incident ability uses both
    secrets in one request: the shared service token authenticates the agent to
    the internal API gateway, while the employee's forwarded OAuth token
    attributes the incident to a real person.

    This is the pattern for internal copilots and operations assistants that sit
    in front of corporate APIs and must respect both service trust and per-user
    permissions.
  share: |-
    Build an internal operations agent with Terraform - it reaches your corporate services with the fetch action using a shared service token for machine-to-machine calls and a personal OAuth secret to act on behalf of the signed-in employee.

    https://chatbotkit.com/examples/terraform-internal-services-fetch
  files: []

- slug: terraform-multi-tenant-agents-shared
  icon: 'lucide/users'
  title: Terraform Multi-Tenant Agents (Shared)
  description: |
    Deploy the same agent for every customer, each isolated in their own
    ChatBotKit child User. One parent User token plus the provider's run_as
    attribute targets each child User through a provider alias - no per-customer tokens.
  keywords:
    - terraform
    - infrastructure-as-code
    - multi-tenant
    - saas
    - users
    - partner
    - white-label
    - run-as
    - provider-aliases
    - isolation
  date: 2026-06-18
  url: https://github.com/chatbotkit/terraform-provider-chatbotkit/tree/main/examples/multi-tenant-agents-shared
  commentary: |
    This example runs a multi-tenant product on ChatBotKit where every customer
    gets the same agent inside their own isolated child User with its own bots,
    datasets, conversations, and settings.

    Isolation comes from the provider's run_as attribute. You hold one
    parent User token (CHATBOTKIT_API_KEY) and configure one provider alias
    per customer, each with run_as set to that customer's child User ID, which
    sends the X-RunAs-UserId header. There are no per-customer tokens - account
    IDs are not secret. This is the standard Terraform multi-account pattern,
    provider aliases, the same way the AWS provider uses assume_role.

    The agent is defined once in a reusable module and deployed into each
    child User via its alias - no for_each. Improve the agent once and it ships
    to every customer on the next apply.

    This is the foundation for white-label and B2B SaaS products where account
    separation, per-tenant limits, and reproducible provisioning matter.
  share: |-
    Run a multi-tenant product on ChatBotKit with Terraform - the same agent in every customer's isolated child User, using one parent User token and the provider's run_as (X-RunAs-UserId), the way AWS uses assume_role.

    https://chatbotkit.com/examples/terraform-multi-tenant-agents-shared
  files: []

