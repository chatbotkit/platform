- slug: template-nextjs-orchestrator-js
  icon: 'lucide/building-2'
  title: Next.js Business Orchestrator Template
  description: |
    A multi-agent business orchestration template with company management,
    agent creation, task scheduling, and real-time chat powered by ChatBotKit,
    Next.js, and shadcn/ui.
  keywords:
    - nextjs
    - app-router
    - template
    - orchestrator
    - multi-agent
    - chat
    - shadcn
    - tailwind
    - next-auth
    - task-scheduling
    - business
  date: 2026-03-28
  url: https://github.com/chatbotkit/template-nextjs-orchestrator-js
  commentary: |
    This template provides a complete multi-agent orchestration interface for
    business workflows. Users create companies, assign AI agents to each
    company with configurable models and backstories, and interact with agents
    through a real-time chat interface.

    The architecture uses ChatBotKit blueprints as company containers and bots
    as agents within those containers. A shared AgentForm component keeps
    creation and settings views consistent. Task scheduling supports immediate
    execution, one-off scheduled runs, and recurring intervals with
    client-side persistence.

    Authentication is handled via NextAuth with Google OAuth, and all server
