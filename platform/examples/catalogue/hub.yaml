#
# HUB
#
# Curated pointers to published hub blueprints. These are NOT copied - each
# entry only carries listing metadata (icon, title, description, keywords) plus
# a `hub` reference. The card links straight to /hub/blueprints/<ref>, which
# already provides clone and visit, and /examples/<slug> redirects there.
#
# @note dates are the hub-page publish dates (hubBlueprintPage.createdAt)
# @note new items should be added on top of the list

- slug: coder
  icon: 'lucide/code'
