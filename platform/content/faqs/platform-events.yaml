- question: What are ChatBotKit Events?
  answer: ChatBotKit Events are events generated by internal processes within ChatBotKit that provide insights into its inner workings. These events can be used by users to subscribe their webhooks to specific chatbot activities or for troubleshooting purposes.
- question: How can I access ChatBotKit Events?
  answer: You can access ChatBotKit Events by integrating your application with ChatBotKit and subscribing to the relevant event types. ChatBotKit will then send these events to the webhook endpoints you specify.
- question: How do I subscribe my webhook to ChatBotKit Events?
  answer: To subscribe your webhook to ChatBotKit Events, you need to configure the webhook URL in your ChatBotKit Webhook configuration screen and specify the event types you want to receive. When these events occur, ChatBotKit will send HTTP POST requests to the webhook URL with the event data in JSON format.
