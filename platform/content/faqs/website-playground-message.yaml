- question: What purpose does this playground serve?
  answer: The Message Playground is a valuable tool designed to simulate the display of various text outputs generated by your conversational AI bot across multiple platforms, including our Widget, Slack, Discord, and WhatsApp integrations. It allows you to preview how your bot's messages will appear to users, ensuring compatibility and optimizing the user experience across different communication channels.
- question: What are the available formatting options?
  answer: ChatBotKit messages are primarily text-based, but they support a wide range of markdown formatting options to enhance the presentation of your messages. This includes basic text styling like bold, italics, and strikethrough. Additionally, you have the ability to organize content into lists, insert hyperlinks, and incorporate code snippets directly into your messages. Beyond text, the platform also supports embedding images, YouTube videos, and a variety of other media types, enabling a rich and engaging interaction with your audience.
- question: How can I troubleshoot issues with message formatting?
  answer: If you encounter any challenges with how messages are formatted or displayed within our integrations, the Message Playground offers a comprehensive testing environment to identify and resolve these issues. You can experiment with different formatting options and preview how your messages will appear in real-time. For more complex problems, our support documentation provides detailed guides and troubleshooting tips. Additionally, our customer support team is always available to assist you with specific inquiries or concerns, ensuring your messages are delivered as intended across all platforms.
