- question: How can I setup ChatBotKit WhatsApp bot?
  answer: A detailed guide for setting up your ChatBotKit WhatsApp bot is available [here](https://chatbotkit.com/docs/whatsapp). The setup process is intricate, so please ensure that you follow each step according to the provided instructions.
- question: I am not receiving any messages from the WhatsApp bot?
  answer: "If you're not receiving messages from your WhatsApp bot, it may indicate a setup issue. The WhatsApp integration requires careful configuration and attention to details. Here are steps to troubleshoot and ensure your settings are correct:\n\n- Begin by checking the WhatsApp Integration Events for any clues. These events may not show up instantly, so a lack of events might hint at a setup problem.\n- The integration process is complex, necessitating exact adherence to instructions.\n\t- Confirm that these have been accurately copied from ChatBotKit to the Meta Developer Portal.\n\t- Ensure these elements are correctly configured.\n- Be aware that test numbers are limited. They can only be used with phone numbers previously verified in the Meta Developer Portal."
