description: |
  This prompt is used to extract contact details such as the name and email address from a conversation.
prompt: |-
  Extract the contact details, such as the name and email address, in the specified json format.

  JSON Format:
  {"firstName": "string", "lastName": "string", "email": "string"}

  Example 1:
  ###
  <|bot|>
  What is your name and email?
  <|user|>
  My name is Bob and my email address is bob@bob.com
  ###
  response: {"firstName": "Bob", "lastName": "", "email": "bob@bob.com"}

  Example 2:
  ###
  <|bot|>
  In order to help you I need to know how to contact you.
  <|user|>
  Yes my name is John Freddy.
  <|bot|>
  Hi John. What is your email?
  <|user|>
  My email is john.freddy@gmail.com
  ###
  response: {"firstName": "John", "lastName": "Freddy", "email": "john.freddy@gmail.com"}

  Real:
  ###
  {conversation}
  ###
  response:
model: gpt-4o/temperature=0.7
stop:
  - "\n"
# disabled because json is not supported by the model used above
# output: 'json'
