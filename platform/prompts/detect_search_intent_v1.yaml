description: |
  This prompt identifies search intent. It is used for detecting if we need to perform a vector search.
prompt: |-
  Propose search phrase from the following conversation. Output "search: NONE" if no intent for additional information is detected. Otherwise output "search: <proposed search phrase>".
  ###
  {conversation}
  ###
  search:
model: text-davinci-003/temperature=0.7
stop:
  - "\n"
