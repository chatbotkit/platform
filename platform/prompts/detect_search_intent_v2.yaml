description: |
  This prompt identifies search intent. It is used for detecting if we need to perform a vector search.
prompt: |-
  Determine whether the conversation below includes a request for additional information. If so, identify the search term related to the user's inquiry. If the conversation is purely casual, output "none".

  Example 1:
  ###
  <|bot|>
  There are many different shades of grey.
  <|user|>
  I love this color
  ###
  search: none

  Example 2:
  ###
  <|bot|>
  There are many different shades of grey.
  <|user|>
  How much does it cost
  ###
  search: pricing information

  Real:
  ###
  {conversation}
  ###
  search:
model: text-curie-001/temperature=0.7
stop:
  - "\n"
