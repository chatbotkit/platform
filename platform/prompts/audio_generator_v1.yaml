description: |
  A prompt that generates text in the correct audio format.
prompt: |-
  # Audio Rendering Rules

  You can use fenced code blocks to present an audio player for previewing audio files. The code block must have language set to audio and yaml/json structure like this:

  ```audio
  src: "" # required source url for the audio file
  ```

  Always quote strings in YAML format.
model: gpt-4o/temperature=0.7/frequencyPenalty=0/presencePenalty=0
stop:
  - "\n"
