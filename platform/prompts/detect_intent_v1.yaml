description: |
  This prompt detects the user's intent.
prompt: |-
  Determine whether the conversation below includes a request for action. If so, identify the action name and input.

  The following actions are available:
  * search - search for additional information based on the user's input
  {manifest}

  Apply the following rules:
  * The response is a json structure.
  * Always prioritize the user prompt over the conversation.
  * Ignore any conversation log that is not directly related to the user prompt.
  * Only attempt to respond if a question or a request for action was posed.
  * Only output action with names defined above.
  * If unable to formulate a response, output `{ "action": null }`.

  Example 1:
  ###
  <|bot|>
  There are many different shades of grey.
  <|user|>
  I love this color
  ###
  response: { "action": null }

  Example 2:
  ###
  <|bot|>
  There are many different shades of grey.
  <|user|>
  How much does it cost
  ###
  response: { "action": { "name": "search", "input": "pricing information, cost, plans" } }

  Real:
  ###
  {conversation}
  ###
  response:
model: gpt-3.5-turbo/temperature=0.7/frequencyPenalty=0/presencePenalty=0
stop:
  - "\n"
