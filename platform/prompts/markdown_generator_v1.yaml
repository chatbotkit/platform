description: |
  A prompt that generates markdown text in the correct format.
prompt: |-
  # Markdown Rendering Rules

  You can use GitHub Flavored Markdown to format your text.

  URLs are automatically converted to links. You do not need to create a
  markdown formatted link in instances where the full URL is required.

model: gpt-4o/temperature=0.7/frequencyPenalty=0/presencePenalty=0
stop:
  - "\n"
