restaurant:
  keywords:
    - restaurant
    - reservation
  intro: >
    This demo showcases how a conversational AI can streamline the booking
    process for appointments or reservations. By interacting with the user, the
    chatbot gathers essential details, offers personalized options, and confirms
    bookings, demonstrating an efficient and user-friendly approach to managing
    reservations.
  initial: ''
  messages:
    - id: tmp-2
      type: user
      text: "I'd like to book a table for dinner."
    - id: tmp-3
      type: bot
      text: 'Sure thing! For how many people would you like to book the table?'
    - id: tmp-4
      type: user
      text: "It's for 4 people."
    - id: tmp-5
      type: bot
      text: 'Got it. And when would you like to make the reservation?'
    - id: tmp-6
      type: user
      text: 'This Friday evening, please.'
    - id: tmp-7
      type: bot
      text: 'Let me check our availability... Yes, we have a table available this Friday evening. Would you prefer an early dinner at 6 PM or a later slot at 8 PM?'
    - id: tmp-8
      type: user
      text: '6 PM would be perfect.'
    - id: tmp-9
      type: bot
      text: "Excellent choice! I've reserved a table for 4 at 6 PM this Friday. May I have a name for the reservation?"
    - id: tmp-10
      type: user
      text: "Yes, it's under the name Alex."
    - id: tmp-11
      type: bot
      text: 'Thank you, Alex. Your table for 4 at 6 PM this Friday is confirmed. We look forward to welcoming you! Would you like an email confirmation?'
    - id: tmp-12
      type: user
      text: 'Yes, please. My email is alex@example.com.'
    - id: tmp-13
      type: bot
      text: "Great! We've sent a confirmation to alex@example.com. If you have any special requests or need to make changes to your booking, feel free to let us know. See you on Friday!"

