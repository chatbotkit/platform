eshop:
  keywords:
    - shop
    - purchase
    - buy
  intro: >
    This demo illustrates how a conversational AI can engage with potential
    customers, understand their specific needs, and guide them towards a
    purchase decision. Through personalized interaction, the bot demonstrates an
    understanding of the customer's inquiry, offers detailed product
    information, and addresses any concerns, leading to a successful conversion.
  initial: ''
  messages:
    - id: tmp-2
      type: user
      text: "I'm interested in purchasing a new laptop. Can you help?"
    - id: tmp-3
      type: bot
      text: |
        Absolutely! Do you have any specific requirements or features you're looking for in a laptop?

        ---

        [Gaming]() [Business]() [Personal Use]()
    - id: tmp-4
      type: user
      text: 'I need it mainly for business purposes.'
    - id: tmp-5
      type: bot
      text: "Great choice! For business use, I'd recommend our [Model X] which features a powerful processor, ample storage, and a long battery life. Would you like more details on this model?"
    - id: tmp-6
      type: user
      text: 'Yes, please. Also, does it come with any warranty?'

