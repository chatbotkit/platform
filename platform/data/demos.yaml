default:
  intro: >
    Intro that contains formatted text. It can be as long as you want and
    include links, images and suggestions like the ones below.
  initial: 'Hi 👋 How can I help you?'
  messages:
    - id: tmp-2
      type: user
      text: "I'm looking for information on [topic]. Can you help me with that?"
    - id: tmp-3
      type: bot
      text: |
        Of course! What would you like to know specifically?

        ---

        [Help with topic 1]() [Help with topic 2]() [Help with topic 3]()
    - id: tmp-4
      type: user
      text: 'Can you provide me with some basic information on [topic]?'
    - id: tmp-5
      type: bot
      text: '[Provide basic information on topic.] Also check out this [link](https://example.com) for more information.'
    - id: tmp-6
      type: user
      text: 'Thanks for that information.'

