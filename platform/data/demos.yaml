hotel:
  keywords:
    - hotel
    - booking
    - travel
  intro: >
    This demo showcases the chatbot's capability to assist users in finding and
    booking hotels. It illustrates a seamless interaction where the chatbot
    gathers the user's preferences, provides tailored hotel options, and guides
    the user through the booking process, simplifying what can often be a
    complex task.
  initial: ''
  messages:
    - id: tmp-2
      type: user
      text: "I'm planning a trip to New York from April 5th to April 10th."
    - id: tmp-3
      type: bot
      text: "Perfect! What's your budget per night, and do you have any specific requirements like free Wi-Fi or breakfast?"
    - id: tmp-4
      type: user
      text: "My budget is around $150 per night, and I'd like free Wi-Fi."
    - id: tmp-5
      type: bot
      text: 'Got it! One moment while I find the best options for you.'
    - id: tmp-6
      type: bot
      text: 'I found several great options within your budget that offer free Wi-Fi. One standout is [Hotel Luxe], centrally located and highly rated. Would you like to book a room?'
    - id: tmp-7
      type: user
      text: 'Yes, that sounds perfect. Can you book it for those dates?'
    - id: tmp-8
      type: bot
      text: "Absolutely! I've reserved a room at [Hotel Luxe] from April 5th to April 10th, totaling $750. You'll receive an email confirmation shortly. Is there anything else I can help with?"
    - id: tmp-9
      type: user
      text: "That's all, thank you!"
