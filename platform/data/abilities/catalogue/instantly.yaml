instantly/campaign/list:
  provider: 'instantly'
  icon: '@logo/instantly.ai'
  name: List Campaigns
  description: List all campaigns.
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/instantly/proxy
    headers:
      X-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      method: GET
      url: /api/v1/campaign/list
    options:
      auth: internal
    ```
  secret: '@instantly'

instantly/campaign/status/fetch:
  provider: 'instantly'
  icon: '@logo/instantly.ai'
  name: Fetch Campaign Status
  description: Fetch the status of a campaign.
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/instantly/proxy
    headers:
      X-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      method: GET
      url: /api/v1/campaign/gte/status
      query:
        campaign_id: $[campaign_id! ys|the campaign ID to fetch the status for]
    options:
      auth: internal
    ```
  secret: '@instantly'

