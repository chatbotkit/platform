instantly/campaign/summary/fetch:
  provider: 'instantly'
  icon: '@logo/instantly.ai'
  name: Fetch Campaign Summary
  description: Fetch the summary of a campaign.
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/instantly/proxy
    headers:
      X-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      method: GET
