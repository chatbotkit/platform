instantly/sql:
  provider: 'instantly'
  icon: '@logo/instantly.ai'
  name: SQL Query
  description: Execute a SQL query on the Instantly platform.
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/instantly/sql
    headers:
      X-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      sql: $[sql! ys|the SQL query to execute - supported tables include instantly.campaigns, instantly.leads, and instantly.emails]
    options:
      auth: internal
    ```
  secret: '@instantly'

