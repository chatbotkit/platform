shopify/search/products:
  provider: 'shopify'
  icon: '@logo/shopify.com'
  name: Search Shopify Products
  description: Search for products in a Shopify store
  tags:
    - shopify
    - products
    - search
  instruction: |
    ```fetch
    method: POST
    url: https://((domain!)).myshopify.com/api/2024-04/graphql.json
    headers:
      X-Shopify-Storefront-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      query: |
        query {
          search(first: 10, sortKey: RELEVANCE, types: PRODUCT, productFilters: { available: true }, query: "$[search_query|search query]") {
            edges {
              node {
                ... on Product {
                  id
                  title
                  description
                  onlineStoreUrl
                  featuredImage {
                    url
                  }
                }
              }
            }
          }
        }
    ```

