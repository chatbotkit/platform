text/generate:
  provider: 'cbk'
  icon: '@logo/chatbotkit.com'
  name: Generate Text
  description: |
    Generate text based on the provided source text
  tags:
    - text
    - generation
  instruction: |
    ```text
    ((directions|optional directions how to generate the text))

    $[source!|the source to use for text generation]
    ```

text/article/generate:
  # @todo migrate to text/generate[article]
  provider: 'cbk'
  icon: '@logo/chatbotkit.com'
  name: Generate Article
  description: |
    Generate an article on the provided topic and source text
  tags:
    - text
    - generation
    - article
  instruction: |
    ```text/model=gpt-4
    Generate a 5-paragraph article on the provided topic, using the supplied source text as a reference.

    Guidelines:
    - The article should be structured into five coherent paragraphs.
    - Maintain the tone of the article consistent with the source text.
    - Ensure the article is relevant to the provided topic.
    - Do not replicate the source text verbatim. Use it as a guide to generate a unique article.

    ((directions|additional directions how to generate the article))

    Topic:
    $[topic!|the topic of the article]

    Source:
    $[source!|the source to use for the article generation]
    ```

