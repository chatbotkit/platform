notion/search:
  provider: 'notion'
  icon: '@logo/notion.so'
  name: Search Notion
  description: Search all of Notion for specific keywords
  tags:
    - notion
    - search
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/notion/search
    headers:
      X-Access-Token: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      query: $[query! ys|a search phrase to use]
      startCursor?: $[cursor ys?|a cursor to use for pagination, if needed]
    options:
      auth: internal
    ```
  commentary: |
    This search is based on the page title. This means that multiple search
    requests may be required to find the exact page you are looking for. This
    can be achieved by providing additional instructions in the agent backstory.

    Alternatively you can use the exhaustive search variant of this ability
    which has is a bit slower but will perform multiple in parallel.
  secret: '@platform/notion'

notion/search[exhaustive]:
  provider: 'notion'
  icon: '@logo/notion.so'
  name: Search Notion
  description: Search all of Notion for specific keywords using multiple queries
  tags:
