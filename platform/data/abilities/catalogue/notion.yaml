      Do not be lazy and do not skip steps.

      Failure to follow the instructions may result in unexpected outcomes and
      unintended consequences.
    task: ((task! ys|the task to perform in Notion))
    abilities:
      - notion/search
      - notion/list
      - notion/page/list
      - notion/page/fetch
      - notion/database/list
      - notion/database/property/search
      - notion/database/property/introspect
      - notion/database/item/list
