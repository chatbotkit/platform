notion/database/property/search:
  provider: 'notion'
  icon: '@logo/notion.so'
  name: Search Notion Database by Property
  description: Perform a search in a Notion database by a specific property value
  tags:
    - notion
    - database
    - item
    - properties
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/notion/database/property/search
    headers:
      x-access-token: ${SECRET_DEFAULT}
      content-type: application/json
    body:
      databaseId: ((databaseId! ys|the database id))
      query: $[properties! j|json object with the properties to search in the form of a record of simple key-value pairs composed of primitive values, e.g. {"k1": "v1", "k2", "v2"}]
      startCursor?: $[cursor ys?|a cursor to use for pagination, if needed]
    options:
      auth: internal
    ```
  secret: '@platform/notion'

