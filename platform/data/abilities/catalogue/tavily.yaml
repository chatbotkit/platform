tavily/search:
  provider: 'tavily'
  icon: '@logo/tavily.com'
  name: Search
  description: Execute a search query using Tavily Search.
  instruction: |
    ```fetch/timeout=60000
    method: POST
    url: https://api.tavily.com/search 
    headers:
      Authorization: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      query: $[query! ys|the search query to execute]
      topic?: ((topic ys? enum<general,news>|the category of the search))
      search_depth?: ((searchDepth ys? enum<basic,advanced>|the depth of the search where advanced search returns the most relevant results))
      chunks_per_source?: ((chunksPerSource number? default<3>|the number of chunks to return per source))
      max_results?: ((maxResults number? default<5>|the maximum number of results to return))
      time_range?: ((timeRange ys? enum<day,week,month,year>|the time range back from the current date to filter results))
      include_answer?: ((includeAnswer boolean?|whether to include the answer in the response))
      include_raw_content? : ((includeRawContent boolean?|whether to include the raw content in the response))
      include_images?: ((includeImages boolean?|whether to include images in the response))
      include_image_descriptions?: ((includeImageDescriptions boolean?|whether to include image descriptions in the response))
    ```
  secret: '@tavily'

tavily/extract:
  provider: 'tavily'
  icon: '@logo/tavily.com'
  name: Extract
  description: Extract web page content from one or more specified URLs.
  instruction: |
    ```fetch/timeout=60000
    method: POST
    url: https://api.tavily.com/extract 
    headers:
      Authorization: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      urls:
        - $[url! ys|the URL to extract content from]
      include_images?: ((includeImages boolean?|whether to include images in the response))
      extract_depth?: ((extractDepth ys? enum<basic,advanced>|the depth of the extraction where advanced extraction returns the most relevant results))
    ```
  secret: '@tavily'
