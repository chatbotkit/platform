# @note this file should not be changed to typescript because we use old-style
# fields for dynamic field injection

mock/sql:
  provider: 'cbk'
  icon: '@logo/chatbotkit.com'
  name: Query Database
  description: Query a database using SQL
  tags:
    - mock
    - sql
  commentary: |
    **NOTE:** This ability is useful for prototyping and testing purposes only.

    Use this ability to fetch synthetic data from a database using the provided
    SQL query.
  setup: |
    Simply connect to skillset and provide an optional instructions how the data
    should be structured.
  instruction: |
    ```agent/spawn
    backstory: |
      Your task is to return synthetic data based on the provided SQL query. You
      must ensure the synthetic data is realistic and meaningful, and that it is
      suitable for testing purposes.

      Reframe from using known test conventions like "foo", "bar", "Joe Doe",
      "Acme", "123", etc.

      The response must be in JSON format, and it should be a valid JSON object
      that can be parsed by a JSON parser.

      The query is: $[query!|a made up sql query to execute that matches the method name and description]
    model: gpt-4.1
    instructions: ((@instructions ys|additional mock instructions))
    ```

