hyperproof/control/list:
  provider: 'hyperproof'
  icon: '@logo/hyperproof.app'
  name: List Controls
  description: List all controls in your Hyperproof organization
  tags:
    - hyperproof
    - controls
    - compliance
    - list
  instruction: |
    ```fetch
    method: GET
    url: https://api.hyperproof.app/v1/controls
    headers:
      Authorization: ${SECRET_DEFAULT}
      Content-Type: application/json
    query:
      canLink?: $[canLink boolean ys?|filter controls that can be linked]
      expandScopes?: $[expandScopes boolean ys?|expand scope information]
      expandTeams?: $[expandTeams boolean ys?|expand team information]
      status?: $[status enum<active,archived> ys?|filter by control status]
    ```
  secret: '@hyperproof'

hyperproof/control/fetch:
  provider: 'hyperproof'
  icon: '@logo/hyperproof.app'
  name: Fetch Control Details
  description: Fetch detailed information about a specific control
  tags:
    - hyperproof
    - control
    - compliance
    - details
  instruction: |
    ```fetch
    method: GET
    url: https://api.hyperproof.app
    path:
      - /v1/controls
      - ((controlId! ys|the control ID))
    headers:
      Authorization: ${SECRET_DEFAULT}
      Content-Type: application/json
    ```
  secret: '@hyperproof'

hyperproof/control/summaries:
  provider: 'hyperproof'
  icon: '@logo/hyperproof.app'
  name: List Control Summaries
  description: List control summaries for your organization
  tags:
