      canLink?: $[canLink boolean ys?|filter controls that can be linked]
      status?: $[status enum<active,archived> ys?|filter by control status]
    ```
  secret: '@hyperproof'

hyperproof/control/update[assign]:
  provider: 'hyperproof'
  icon: '@logo/hyperproof.app'
  name: Assign Control to User
  description: Assign a specific control to a user in your Hyperproof organization
  tags:
    - hyperproof
    - control
    - assignment
    - compliance
  instruction: |
    ```fetch
    method: PATCH
    url: https://api.hyperproof.app
    path:
      - /v1/controls 
      - ${controlId! ys|the control ID}
    headers:
      Authorization: ${SECRET_DEFAULT}
      Content-Type: application/json
    body:
      owner: ((owner! ys|the user ID to assign the control to))
    ```
  secret: '@hyperproof'

