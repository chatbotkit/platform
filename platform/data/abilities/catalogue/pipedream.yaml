pipedream/connect/action/run:
  provider: 'pipedream'
  icon: '@logo/pipedream.com'
  name: Run Action
  description: |
    Execute an action with the provided configuration and return results
  tags:
    - pipedream
    - connect
    - action
    - run
  instruction: |
    ```fetch
    method: POST
    url: https://api.pipedream.com
    path:
      - /v1/connect
      - ((projectId ys!|the pipedream project id))
      - /actions/run
    headers:
      Authorization: ${SECRET_DEFAULT}
      x-pd-environment: ((environment ys! enum<development,production> default<development>|the pipedream environment))
      Content-Type: application/json
    body:
      id: ((actionId ys!|the pipedream action id))
      external_user_id: ${EXTERNAL_ID}
      configured_props: ((props! j|the action configuration properties))
    ```
