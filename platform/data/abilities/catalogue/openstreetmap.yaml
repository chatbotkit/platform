openstreetmap/overpass/amenity/around/list:
  provider: 'openweathermap'
  icon: '@logo/openstreetmap.org'
  name: Find Nearby Amenities
  description: Get a list of amenities around a specific location
  tags:
    - openstreetmap
    - overpass
    - amenity
  instruction: |
    ```fetch
    method: POST
    url: /api/auxiliary/skillset/ability/openstreetmap/overpass/amenity/around/list
    headers:
      content-type: application/json
    body:
      url: ((url! ys|the overpass API URL))
      types: ((types! js|query types separated by comma e.g., node, way, relation))
      tags: ((tags! js|the tags to search for in format key=value separated by semicolon))
      radius: ((radius! js|the search radius in meters))
      lat: $[lat! ys|latitude]
      lon: $[lon! ys|longitude]
    options:
      auth: internal
    ```
