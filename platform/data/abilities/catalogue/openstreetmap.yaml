openweathermap/weather/current:
  provider: 'openweathermap'
  icon: '@logo/openweathermap.org'
  name: Retrieve Current Weather from OpenWeatherMap
  description: Retrieve the current weather for a specific location using OpenWeatherMap
  tags:
    - openweathermap
    - weather
  instruction: |
    ```fetch
    GET https://api.openweathermap.org/data/2.5/weather?q=$[location|City name]&appid=${SECRET_DEFAULT}
    ```

openweathermap/weather/forecast:
  provider: 'openweathermap'
  icon: '@logo/openweathermap.org'
  name: Retrieve Weather Forecast from OpenWeatherMap
  description: Retrieve the weather forecast for a specific location using OpenWeatherMap
  tags:
    - openweathermap
    - weather
    - forecast
  instruction: |
    ```fetch
    GET https://api.openweathermap.org/data/2.5/forecast?q=$[location|City name]&appid=${SECRET_DEFAULT}
    ```

