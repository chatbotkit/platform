vanta/auth/test:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Test Vanta API Connection
  description: Test the Vanta API connection and verify authentication credentials are working properly.
  tags:
    - vanta
    - auth
    - test
  instruction: |
    ```fetch
    method: GET
    url: https://api.vanta.com/v1/me
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
    ```
  secret: '@vanta'

# ---

vanta/vendor/list:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: List Vanta Vendors
  description: Retrieve a list of all vendors configured in your Vanta organization.
  tags:
    - vanta
    - vendor
    - list
  instruction: |
    ```fetch
    method: GET
    url: https://api.vanta.com/v1/vendors
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
    query:
      page?: $[page number default<1>|page number for pagination]
      per_page?: $[per_page number default<25>|number of items per page (max 100)]
    ```
  secret: '@vanta'

vanta/vendor/fetch:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Fetch Vanta Vendor
  description: Retrieve detailed information about a specific vendor by ID.
  tags:
    - vanta
    - vendor
    - fetch
  instruction: |
    ```fetch
    method: GET
    url: https://api.vanta.com/v1/vendors/$[vendor_id! euc|the vendor ID]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
    ```
  secret: '@vanta'

vanta/vendor/create:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Create Vanta Vendor
  description: Create a new vendor in your Vanta organization with the specified details.
  tags:
    - vanta
    - vendor
    - create
  instruction: |
    ```fetch
    method: POST
    url: https://api.vanta.com/v1/vendors
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
      Content-Type: application/json
    body:
      name: $[name! ys|vendor name]
      website?: $[website ys?|vendor website URL]
      description?: $[description ys?|vendor description]
      contact_email?: $[contact_email ys?|vendor contact email address]
      business_owner_email?: $[business_owner_email ys?|business owner email address]
      technical_owner_email?: $[technical_owner_email ys?|technical owner email address]
      vendor_type?: $[vendor_type ys? enum<software,consulting,other>|type of vendor]
      criticality?: $[criticality ys? enum<critical,high,medium,low>|vendor criticality level]
      data_classification?: $[data_classification ys? enum<public,internal,confidential,restricted>|data classification level]
    ```
  secret: '@vanta'

vanta/vendor/update:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Update Vanta Vendor
  description: Update an existing vendor's information in your Vanta organization.
  tags:
    - vanta
    - vendor
    - update
  instruction: |
    ```fetch
    method: PATCH
    url: https://api.vanta.com/v1/vendors/$[vendor_id! euc|the vendor ID]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
      Content-Type: application/json
    body:
      name?: $[name ys?|vendor name]
      website?: $[website ys?|vendor website URL]
      description?: $[description ys?|vendor description]
      contact_email?: $[contact_email ys?|vendor contact email address]
      business_owner_email?: $[business_owner_email ys?|business owner email address]
      technical_owner_email?: $[technical_owner_email ys?|technical owner email address]
      vendor_type?: $[vendor_type ys? enum<software,consulting,other>|type of vendor]
      criticality?: $[criticality ys? enum<critical,high,medium,low>|vendor criticality level]
      data_classification?: $[data_classification ys? enum<public,internal,confidential,restricted>|data classification level]
    ```
  secret: '@vanta'

vanta/vendor/delete:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Delete Vanta Vendor
  description: Remove a vendor from your Vanta organization. This action cannot be undone.
  tags:
    - vanta
    - vendor
    - delete
  instruction: |
    ```fetch
    method: DELETE
    url: https://api.vanta.com/v1/vendors/$[vendor_id! euc|the vendor ID]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/json
    ```
  secret: '@vanta'

