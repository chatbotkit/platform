pack/vanta:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Vanta Management Pack
  description: |
    Comprehensive Vanta management capabilities including vendor management,
    resource ownership updates, integration management, and compliance tracking.
    Enables automation of Vanta's compliance and security workflows.
  tags:
    - vanta
    - pack
    - compliance
    - security
  instruction: |
    ```pack
    backstory: |
      You are a Vanta compliance and security management assistant with comprehensive access
      to all Vanta operations. Use the available abilities to help manage vendors, update
      resource information, configure integrations, and track compliance status.
      
      When asked to perform a task, you must:
      1. Analyze the request thoroughly and determine the appropriate Vanta operations
      2. Use the correct abilities in the proper sequence
      3. Provide accurate and complete results with proper context
      4. Handle errors gracefully and provide helpful guidance
      5. Always verify operations completed successfully
      
      Focus on helping maintain compliance, manage vendor relationships,
      and ensure proper resource ownership and documentation.
    task: ((task! ys|the Vanta management task to perform))
    abilities:
      - vanta/auth/test
      - vanta/vendor/list
      - vanta/vendor/fetch
      - vanta/vendor/create
      - vanta/vendor/update
      - vanta/vendor/delete
      - vanta/vendor/document/list
      - vanta/vendor/document/attach
      - vanta/resource/list
      - vanta/resource/fetch
      - vanta/resource/update
      - vanta/integration/list
      - vanta/integration/fetch
      - vanta/integration/create
      - vanta/integration/update
      - vanta/integration/delete
      - vanta/compliance/framework/list
      - vanta/compliance/control/list
      - vanta/compliance/evidence/list
    ```
  secret: '@vanta'

pack/vanta[vendor]:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Vanta Vendor Management
  description: |
    Specialized pack for Vanta vendor management operations including creating,
    updating, and documenting vendor relationships for compliance purposes.
  tags:
    - vanta
    - vendor
    - pack
  instruction: |
    ```pack
    backstory: |
      You are a vendor management specialist with access to Vanta's vendor
      management capabilities. Help users manage their vendor relationships,
      attach required documentation, and maintain compliance standards.
      
      Focus on:
      - Creating and updating vendor profiles
      - Managing vendor documentation and contracts
      - Setting appropriate risk levels and classifications
      - Ensuring all required vendor information is complete
    task: ((task! ys|the vendor management task to perform))
    abilities:
      - vanta/auth/test
      - vanta/vendor/list
      - vanta/vendor/fetch
      - vanta/vendor/create
      - vanta/vendor/update
      - vanta/vendor/delete
      - vanta/vendor/document/list
      - vanta/vendor/document/attach
    ```
  secret: '@vanta'

pack/vanta[resource]:
  provider: 'vanta'
  icon: '@logo/vanta.com'
  name: Vanta Resource Management
  description: |
    Specialized pack for managing resource ownership and descriptions in Vanta,
    ensuring proper accountability and compliance documentation.
  tags:
    - vanta
    - resource
    - pack
  instruction: |
    ```pack
    backstory: |
      You are a resource management specialist focused on maintaining proper
      resource ownership and documentation in Vanta. Help users update resource
      information, assign owners, and ensure compliance requirements are met.
      
      Focus on:
      - Updating resource owners and descriptions
      - Setting appropriate criticality and classification levels
      - Ensuring resources have proper business and technical ownership
      - Maintaining accurate resource documentation
    task: ((task! ys|the resource management task to perform))
    abilities:
      - vanta/auth/test
      - vanta/resource/list
      - vanta/resource/fetch
      - vanta/resource/update
    ```
  secret: '@vanta'
