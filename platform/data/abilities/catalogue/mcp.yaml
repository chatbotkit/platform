mcp/load[github]:
  provider: 'github'
  icon: '@logo/github.com'
  name: Load GitHub Tools
  description: |
    Dynamically load MCP tools for comprehensive GitHub repository management.

    This ability provides access to advanced GitHub capabilities including:
    - Create, update, and manage repositories and branches
    - Query commit history with complex filters and sorting
    - Manage pull requests, issues, and project boards
    - Handle webhooks and integrations with other tools
    - Work with GitHub's reporting and analytics features

    Note: Do not call this ability if GitHub MCP tools are already loaded and available.
  tags:
    - mcp
  instruction: |
    ```mcp/install
    url: https://api.githubcopilot.com/mcp
    prefix: github
    headers:
      Authorization: ${SECRET_DEFAULT}
      X-MCP-Toolsets": ((toolsets string|a comma-separated list of toolsets to load, e.g., "repos,issues,pull_requests" or leave empty to load all available toolsets))
      X-MCP-Tools: ((tools string|a comma-separated list of specific tools to load, e.g., "create_issue,merge_pull_request" or leave empty to load all available tools))
      X-MCP-Readonly": ((readonly boolean default<false>|whether to enable read-only mode)) 
      X-MCP-Lockdown": ((lockdown boolean default<false>|whether to enable lockdown mode, hiding public issue details created by users without push access))
    ```
  secret: '@github[key]'

