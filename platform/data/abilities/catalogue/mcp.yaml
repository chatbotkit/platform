# Secrets catalogue: platform/data/secrets/catalogue/standard.yaml
# Each ability references a secret via `secret: '@<id>'`. The secret ID must be
# registered in the catalogue above before the ability can be used.
#
# @todo implement https://mcp.replicate.com/ once it support http (not sse)
# @todo implement https://mcp.wrike.com/ once it support http (not sse)

mcp/load[notion]:
  provider: 'notion'
  icon: '@logo/notion.so'
  name: Load Notion Tools
  description: |
    Dynamically load Model Context Protocol (MCP) tools for comprehensive Notion workspace management.

    This ability provides access to advanced Notion capabilities including:
    - Create, read, update, and delete pages and databases
    - Query databases with complex filters and sorting
    - Manage page properties, blocks, and content
    - Handle workspace navigation and organization
    - Work with templates and page structures

    Note: Do not call this ability if Notion MCP tools are already loaded and available.
  tags:
    - mcp
  instruction: |
    ```mcp/install
    url: https://mcp.notion.com/mcp
    prefix: notion
    ```
  secret: '@notion[mcp]'

