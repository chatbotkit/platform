github/repository/list:
  provider: 'github'
  icon: '@logo/github.com'
  name: List GitHub Repositories
  description: List all repositories for a specific user or organization on GitHub
  tags:
    - github
    - repository
    - list
  instruction: |
    ```fetch
    method: GET
    url: https://api.github.com/users/$[username! euc|the github username]/repos
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    query:
      type?: $[type ys? enum<all,owner,public,forks,private,member>|repository type (e.g., all, owner, public, forks, private, member)]
      sort?: $[sort ys? enum<created,updated,pushed,full_name>|sort order (e.g., created, updated, pushed, full_name)]
      direction?: $[direction ys? enum<asc,desc>|sort direction (e.g., asc, desc)]
    options:
      jmespath: |
        [*].{
          id: id,
          name: name,
          full_name: full_name,
          private: private,
          owner: owner.login,
          html_url: html_url,
          description: description,
          created_at: created_at,
          updated_at: updated_at,
          pushed_at: pushed_at
        }
    ```
  secret: '@platform/github'

github/repository/fetch:
  provider: 'github'
