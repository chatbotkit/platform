github/repository/update:
  provider: 'github'
  icon: '@logo/github.com'
  name: Update GitHub Repository
  description: Update settings of an existing repository on GitHub
  tags:
    - github
    - repository
    - update
  instruction: |
    ```fetch
    method: PATCH
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
    body:
      name?: $[name ys?|repository name]
      description?: $[description ys?|repository description]
      homepage?: $[homepage ys?|repository homepage URL]
      private?: $[private ys? enum<true,false>|whether the repository is private]
      has_issues?: $[has_issues ys? enum<true,false>|whether to enable issues]
      has_projects?: $[has_projects ys? enum<true,false>|whether to enable projects]
      has_wiki?: $[has_wiki ys? enum<true,false>|whether to enable wiki]
      default_branch?: $[default_branch ys?|default branch name]
      archived?: $[archived ys? enum<true,false>|whether the repository is archived]
    ```
  secret: '@platform/github'

github/repository/delete:
  provider: 'github'
  icon: '@logo/github.com'
  name: Delete GitHub Repository
  description: Delete a repository on GitHub (requires admin access)
  tags:
    - github
    - repository
    - delete
  instruction: |
    ```fetch
    method: DELETE
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    ```
  secret: '@platform/github'

github/repository/collaborator/list:
  provider: 'github'
  icon: '@logo/github.com'
  name: List GitHub Repository Collaborators
  description: List all collaborators for a specific repository on GitHub
  tags:
    - github
    - repository
    - collaborator
    - list
  instruction: |
    ```fetch
    method: GET
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/collaborators
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    query:
      affiliation?: $[affiliation ys? enum<outside,direct,all> default<all>|filter by affiliation (outside, direct, all)]
    options:
      jmespath: |
        [*].{
          id: id,
          login: login,
          type: type,
          site_admin: site_admin,
          permissions: permissions,
          html_url: html_url
        }
    ```
  secret: '@platform/github'

github/repository/collaborator/add:
  provider: 'github'
  icon: '@logo/github.com'
  name: Add GitHub Repository Collaborator
  description: Add a collaborator to a repository on GitHub
  tags:
    - github
    - repository
    - collaborator
    - add
  instruction: |
    ```fetch
    method: PUT
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/collaborators/$[username! euc|username to add as collaborator]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
    body:
      permission?: $[permission ys? enum<pull,triage,push,maintain,admin> default<push>|permission level to grant (pull, triage, push, maintain, admin)]
    ```
  secret: '@platform/github'

github/repository/collaborator/remove:
  provider: 'github'
  icon: '@logo/github.com'
  name: Remove GitHub Repository Collaborator
  description: Remove a collaborator from a repository on GitHub
  tags:
    - github
    - repository
    - collaborator
    - remove
  instruction: |
    ```fetch
    method: DELETE
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/collaborators/$[username! euc|username to remove as collaborator]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    ```
  secret: '@platform/github'

github/repository/content/list:
  provider: 'github'
  icon: '@logo/github.com'
  name: List GitHub Repository Contents
  description: List contents of a directory in a repository on GitHub
  tags:
    - github
    - repository
    - content
    - list
  instruction: |
    ```fetch
    method: GET
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/contents/$[path euc default<>|directory path (empty for root)]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    query:
      ref?: $[ref ys?|branch, tag, or commit SHA (defaults to main branch)]
    options:
      jmespath: |
        [*].{
          name: name,
          path: path,
          type: type,
          size: size,
          sha: sha,
          url: url,
          html_url: html_url,
          download_url: download_url
        }
    ```
  secret: '@platform/github'

github/repository/content/fetch:
  provider: 'github'
  icon: '@logo/github.com'
  name: Fetch GitHub Repository File Content
  description: Fetch the content of a specific file in a repository on GitHub
  tags:
    - github
    - repository
    - content
    - fetch
  instruction: |
    ```fetch
    method: GET
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/contents/$[path! euc|file path]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
    query:
      ref?: $[ref ys?|branch, tag, or commit SHA (defaults to main branch)]
    options:
      jmespath: |
        {
          name: name,
          path: path,
          type: type,
          size: size,
          sha: sha,
          content: content,
          encoding: encoding,
          download_url: download_url,
          html_url: html_url
        }
    ```
  secret: '@platform/github'

github/repository/content/create:
  provider: 'github'
  icon: '@logo/github.com'
  name: Create GitHub Repository File
  description: Create or update a file in a repository on GitHub
  tags:
    - github
    - repository
    - content
    - create
  instruction: |
    ```fetch
    method: PUT
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/contents/$[path! euc|file path]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
    body:
      message: $[message! ys|commit message]
      content: $[content! ys|base64 encoded file content]
      sha?: $[sha ys?|blob SHA of the file being replaced (required for updates)]
      branch?: $[branch ys?|branch name (defaults to main branch)]
      committer?: $[committer j?|object containing committer information]
      author?: $[author j?|object containing author information]
    ```
  secret: '@platform/github'

github/repository/content/delete:
  provider: 'github'
  icon: '@logo/github.com'
  name: Delete GitHub Repository File
  description: Delete a file from a repository on GitHub
  tags:
    - github
    - repository
    - content
    - delete
  instruction: |
    ```fetch
    method: DELETE
    url: https://api.github.com/repos/$[owner! euc|repository owner]/$[repo! euc|repository name]/contents/$[path! euc|file path]
    headers:
      Authorization: ${SECRET_DEFAULT}
      Accept: application/vnd.github.v3+json
      Content-Type: application/json
    body:
      message: $[message! ys|commit message]
      sha: $[sha! ys|blob SHA of the file being deleted]
      branch?: $[branch ys?|branch name (defaults to main branch)]
      committer?: $[committer j?|object containing committer information]
      author?: $[author j?|object containing author information]
    ```
  secret: '@platform/github'

pack/github:
  provider: 'github'
  icon: '@logo/github.com'
  name: Comprehensive GitHub Operations
  description: |
    Complete GitHub management pack with full repository, issue, pull request,
    branch, release, and content operations.
  tags:
    - github
    - pack
    - beta
  instruction: |
    ```pack
    backstory: |
      You are a GitHub repository management assistant with comprehensive access
      to all GitHub operations. Use the available abilities to:
      
      - Manage repositories (create, update, delete, list)
      - Handle issues and pull requests (create, update, merge, comment)
      - Manage branches, tags, and releases
      - Work with repository content and files
      - Manage collaborators and permissions
      
      When performing operations:
      1. Always verify repository ownership and permissions
      2. Use descriptive commit messages for content operations
      3. Provide clear feedback on operation success/failure
      4. Follow Git best practices for branching and merging
      5. Be careful with destructive operations (delete, force merge)
      
      Always ask for confirmation before performing destructive operations.
    task: ((task! ys|the GitHub operation to perform))
    abilities:
      - github/repository/list
      - github/repository/fetch
      - github/repository/create
      - github/repository/update
      - github/repository/delete
      - github/repository/issue/list
      - github/repository/issue/fetch
      - github/repository/issue/create
      - github/repository/issue/update
      - github/repository/issue/close
      - github/repository/issue/comment/list
      - github/repository/issue/comment/fetch
      - github/repository/issue/comment/create
      - github/repository/issue/comment/update
      - github/repository/branch/list
      - github/repository/branch/fetch
      - github/repository/branch/create
      - github/repository/branch/delete
      - github/repository/pull/list
      - github/repository/pull/fetch
      - github/repository/pull/create
      - github/repository/pull/update
      - github/repository/pull/merge
      - github/repository/pull/comment/list
      - github/repository/pull/comment/create
      - github/repository/release/list
      - github/repository/release/fetch
      - github/repository/release/create
      - github/repository/tag/list
      - github/repository/tag/fetch
      - github/repository/tag/create
      - github/repository/collaborator/list
      - github/repository/collaborator/add
      - github/repository/collaborator/remove
      - github/repository/content/list
      - github/repository/content/fetch
      - github/repository/content/create
      - github/repository/content/delete
    ```
  secret: '@platform/github'
