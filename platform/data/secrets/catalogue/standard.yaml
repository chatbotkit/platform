# @see https://docs.x.com/x-api/getting-started/about-x-api
# @see https://docs.x.com/fundamentals/authentication/overview
twitter:
  icon: '@logo/x.com'
  name: X (Twitter) API Token
  description: The bearer token for accessing the X (formerly Twitter) API v2.
  type: bearer
  kind: shared
  setup: >-
    Create a project and app in the [X Developer Portal](https://developer.x.com/en/portal/dashboard).
    For read-only access, copy the app's OAuth 2.0 **Bearer Token** from the app's
    Keys and tokens tab and paste it here. For write access (posting, liking,
    following, direct messages, bookmarks and other user actions) you must instead
    supply an OAuth 2.0 **user access token** obtained via the Authorization Code
    with PKCE flow, with the scopes you need enabled (for example `tweet.read`,
    `tweet.write`, `users.read`, `like.write`, `follows.write`, `dm.write`,
    `bookmark.write`, `list.write` and `offline.access`). Either token type is sent
    as `Authorization: Bearer <token>`.
  commentary: >-
    A single bearer secret backs both auth modes X supports. An app-only Bearer
    Token can only call endpoints that do not require a user context (search,
    lookups, public metrics). Endpoints that act on behalf of a user - anything
    under `users/me`, likes, follows, reposts, bookmarks, mutes, blocks, direct
    messages and list mutation - require an OAuth 2.0 user access token with the
    matching scope, otherwise X returns 401/403.
