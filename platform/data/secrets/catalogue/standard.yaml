github[oauth]:
  icon: '@logo/github.com'
  name: GitHub OAuth2 Token
  description: The OAuth2 token for accessing GitHub.
  type: oauth
  kind: personal
  config:
    clientId: ''
    clientSecret: ''
    authorizationUrl: https://github.com/login/oauth/authorize?prompt=select_account
    tokenUrl: https://github.com/login/oauth/access_token
    scope: >-
      user:email
      read:user
      read:org
      read:project
      repo
      gist
      notifications

github[key]:
  icon: '@logo/github.com'
  name: GitHub Personal Access Token
  description: The personal access token for accessing GitHub.
  setup: |
    1. In GitHub, open Settings → Developer settings → Personal access tokens.
    2. Create a fine-grained token or classic token for the account you want to use.
    3. Grant access to the repositories and permissions required by your abilities.
    4. Generate the token and paste it as this secret value.
  type: bearer
  kind: shared

github[app]:
  icon: '@logo/github.com'
  name: GitHub App Private Key
  description: The private key for signing GitHub App JWTs.
  setup: |
    1. In GitHub, open Settings → Developer settings → GitHub Apps.
    2. Create a GitHub App or open an existing one.
    3. Copy the App ID from the app's About section and set it as the `iss` claim in this template.
    4. Under Private keys, generate a private key and download the `.pem` file.
    5. Paste the full private key file contents as this secret value, including the BEGIN and END lines.
    6. Install the GitHub App on the account or organization that owns the repositories you want to access.
  type: jwt
  kind: shared
  config:
    algorithm: RS256
    expiresInSeconds: 600
    schema: Bearer
    claims:
      iss: ''

