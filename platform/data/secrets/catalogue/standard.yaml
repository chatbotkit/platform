# @see standard.d.ts for type definitions
#
# ---
# ---
# ---

#
# `kind` - who the credential belongs to:
#
#   personal - each contact connects their own named account (the secret
#              belongs to a user). Use for services with a notion of named
#              users signing in.
#   shared   - one workspace-wide service account (an API token, service key).
#              Use for machine credentials with no per-user identity.
#
# The default follows the secret `type`: an `oauth` connection and the
# platform-hosted `template` type sign in a named account, so they are
# `personal`; `bearer`, `basic`, `jwt` and `plain` are service credentials, so
# they are `shared`. `kind` is stated explicitly on every template rather than
# derived at runtime - the catalogue is static - and standard.utest.ts enforces
# that rule against every entry here. Only set a kind that differs from the type
# default for a deliberate exception (and add it to the allowlist in the test).

# ---
# ---
# ---

