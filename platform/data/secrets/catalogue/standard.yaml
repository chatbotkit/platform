  icon: '@logo/snowflake.com'
  name: Snowflake JWT Token
  description: The JWT token for accessing Snowflake SQL REST API. Use key pair authentication to generate a JWT token.
  type: bearer
  kind: shared
  setup: >
    To authenticate with Snowflake SQL REST API using key pair authentication:
    1. Generate an RSA key pair and assign the public key to your Snowflake user
    2. Create a JWT token using your private key with claims: iss (account.user), sub (account.user), iat, exp
    3. Use the JWT token as a Bearer token for API requests
    For detailed instructions, see: https://docs.snowflake.com/en/developer-guide/sql-api/authenticating

