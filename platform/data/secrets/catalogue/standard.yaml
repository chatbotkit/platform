# @see https://planetscale.com/docs/api/reference/service-tokens
planetscale:
  icon: '@logo/planetscale.com'
  name: PlanetScale Service Token
  description: The service token for accessing the PlanetScale API.
  type: plain
  kind: shared
  setup: >
    To create a service token, log in to PlanetScale and go to Settings >
    Service tokens > New service token. Copy both the token ID and the token
    value, then enter them here joined by a colon as `TOKEN_ID:TOKEN` - this
    combined value is the whole `Authorization` header PlanetScale expects.
    Then grant the token access to each database you want to reach. For
    read-only observability, `read_database`, `read_branch` and
    `read_deploy_request` cover databases, branches, insights and deploy
    requests. Add further permissions from the token's permission list only if
    you need them - you can only grant permissions you hold yourself.
  commentary: >
    PlanetScale does not use a `Bearer` scheme. Service tokens authenticate with
    a bare `Authorization: <TOKEN_ID>:<TOKEN>` header, so this must stay a
    `plain` secret - a `bearer` secret would emit `Bearer <value>` (or
    `<schema> <value>` via config.schema, always space-separated) and PlanetScale
    would reject it. Abilities therefore reference the value directly as
    `Authorization: ${SECRET_DEFAULT}`.

